# DO NOT rename to "rmpg-api-proxy". This config deploys the rewrite app
# (src/index.ts) and MUST target the worker `rmpg-flex-api`. The worker named
# `rmpg-api-proxy` is the separate strangler dispatcher (proxy/wrangler.toml,
# bound to rmpgutah.us/api/*) — it routes /api/auth/login to the legacy worker.
# Renaming this to `rmpg-api-proxy` makes `wrangler deploy` overwrite the
# dispatcher with this rewrite, which has NO `JWT_SECRET` secret of its own →
# every login 500s on token signing (incident 2026-06-02, PRs #937/#946 →
# reverted by #945 and this one). See [[project-auth-login-500-incident]].
# ALSO do not rename to "rmpg-flex" — that is the LEGACY worker (login hot
# path via the proxy) and shares its name with the Pages project. A
# git-connected Workers Build on the `rmpg-flex` worker kept auto-committing
# that rename (bot commits #2495–#2511, 2026-06-30/07-01) and deploying this
# rewrite OVER the legacy worker. Fix the build integration in the Cloudflare
# dashboard (disconnect the repo from the `rmpg-flex` worker); never "fix"
# the name here to match the bot.
name = "rmpg-flex-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# ─── Smart Placement (enabled 2026-06-12, monitor) ─────────
# This worker is D1-heavy (most CAD endpoints make several sequential
# D1 round-trips). Smart Placement lets CF run the fetch handler closer
# to D1's region instead of always at the edge nearest the user, which
# can cut multi-query latency. Caveats being monitored:
#   • It does NOT relocate Durable Objects — the voice/alert WebSocket
#     hubs (/api/voice-ws, /api/alerts-ws) are unaffected.
#   • Light/interactive requests could see slightly higher first-byte
#     latency if CF places compute away from SLC.
# CF only relocates when it predicts a net win, and (since 2025-03)
# won't revert on brief low-traffic dips. To roll back: delete this block
# and redeploy. Watch dispatch responsiveness for ~a day.
[placement]
mode = "smart"

# Custom domain. Wrangler provisions the DNS record + zone hostname
# mapping; the zone (rmpgutah.us) must already be on this Cloudflare
# account.
[[routes]]
pattern = "api.rmpgutah.us"
custom_domain = true

# Serve /downloads/* from the app domain too, so a relative link still reaches
# this Worker instead of falling through to the Pages SPA catch-all (which
# returns index.html at HTTP 200 — an 11 KB "installer"). This mirrors the
# mechanism already proven by rmpg-api-proxy for /api/*: a zone route, NOT a
# _redirects rule, because Pages ignores status-200 rewrites to another origin.
#
# Deliberately a safety net, not the primary path. /api/downloads/info returns
# absolute URLs and a guard test (client/src/__tests__/downloadLinks.guard.test.ts)
# forbids relative links, so this only catches surfaces not yet found and links
# written later.
[[routes]]
pattern = "rmpgutah.us/downloads/*"
zone_name = "rmpgutah.us"

# D1 Database — points at the LIVE production DB (the one bound to the legacy
# rmpg-flex Worker that the rmpg-api-proxy falls back to). The `rmpg-flex-db`
# (8893480a-…) created with this rewrite is EMPTY of production data; reading
# from it caused every dispatch-panel endpoint routed through the proxy to
# return "Call not found" / empty arrays on 2026-05-24. See
# [[project-live-db-is-different]] memory for the dual-DB history. Schema
# repairs needed to keep this rewrite happy against the live DB live in
# migrations/live/L0001_*.sql + L0002_*.sql (applied manually via D1 MCP).
[[d1_databases]]
binding = "DB"
database_name = "rmpg-flex"
database_id = "785de7ae-3e7a-4e01-93bb-d24ddd813f6b"

# Dedicated geo database — statewide UGRC address points (~1.48M rows) for
# the map address search + snap-to-address. Kept SEPARATE from the production
# CAD DB so the address index can't bloat or contend with live dispatch data.
[[d1_databases]]
binding = "GEO_DB"
database_name = "rmpg-geo"
database_id = "fbc33751-dce0-499a-bc45-93c0b7ee0da1"

[[d1_databases]]
binding = "KIOSK_DB"
database_name = "kiosk-linux-fleet"
database_id = "a74cd65e-5e7f-4ab1-a238-ba86c649efe4"
migrations_dir = "kiosk-linux/migrations"

# ─── Durable Objects ─────────────────────────────────────
# WelfareWatchDO — automated officer welfare escalation timer
# (Spillman parity, DI-4 follow-up). One instance per officer
# via env.WELFARE_WATCH.idFromName(`u-${userId}`).
[[durable_objects.bindings]]
name = "WELFARE_WATCH"
class_name = "WelfareWatchDO"

# VoiceHubDO — one instance per radio channel / panic incident; the
# single shared hub that relays + records live voice (PTT + panic
# audio). Reached via /api/voice-ws on this worker's custom domain.
[[durable_objects.bindings]]
name = "VOICE_HUB"
class_name = "VoiceHubDO"

# AlertHubDO — ONE global instance (idFromName('global')) that every client
# holds an alert socket to (/api/alerts-ws on this worker's custom domain).
# The shared bus that lets rewrite route handlers broadcast officer-safety
# events (panic, etc.) agency-wide — the rewrite's own per-isolate WS map is
# dead because clients' main /api/ws socket lives on the legacy worker.
[[durable_objects.bindings]]
name = "ALERT_HUB"
class_name = "AlertHubDO"

[[durable_objects.bindings]]
name = "DEEP_RESEARCH"
class_name = "DeepResearchDO"

[[durable_objects.bindings]]
name = "PERSON_INTEL_DO"
class_name = "PersonIntelDO"

# FlexCamRemuxDO — one instance per footage_request_id (idFromName('rmx-' + id))
# for lazy MP4 → fMP4 remux. Triggered by POST /api/flexcam/render/:id for
# format='mp4'. See src/durable-objects/FlexCamRemuxDO.ts.
[[durable_objects.bindings]]
name = "FLEXCAM_REMUX"
class_name = "FlexCamRemuxDO"

# WebBrowserSessionDO — one instance per active web-based Company Browser
# session (idFromName(sessionId)), holding a real headless Chrome instance
# via Cloudflare's Browser Rendering API. Session-scoped, not global —
# unlike VOICE_HUB/ALERT_HUB, a new id is minted per POST /api/web-browser/session.
[[durable_objects.bindings]]
name = "WEB_BROWSER_SESSION"
class_name = "WebBrowserSessionDO"

[[migrations]]
tag = "v1"
# new_sqlite_classes (not new_classes) — free-plan compatible.
# SQLite-backed DO storage; same API surface for our use case.
new_sqlite_classes = ["WelfareWatchDO"]

# KV for sessions and caching
[[kv_namespaces]]
binding = "KV"
id = "8e01c392038e4f76838ca9a1130c908e"
preview_id = "8e01c392038e4f76838ca9a1130c908e"

# R2 buckets
[[r2_buckets]]
binding = "MAP_DATA"
bucket_name = "system-essentials"

# UPLOADS — general-purpose user upload bucket.
# Currently holds business-photos/ prefix (PR-E). Future R2-backed
# routes (companyDocuments, dashcamVideos, attachments) can layer
# their own prefixes under this same bucket to keep the binding
# count low. Bucket was provisioned 2026-05-24.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "rmpg-flex-uploads"

# DOWNLOADS — desktop + mobile installer artifacts for public download
# and auto-update serving. Contains .exe, .dmg, .apk, .zip, .blockmap,
# .yml manifests, and the download page index.html.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "rmpg-flex-downloads"

[[r2_buckets]]
binding = "KIOSK_DEVICES"
bucket_name = "kiosk-linux-devices"

# TESSERACT_TRAINING — restricted bucket for the custom fine-tuned OCR
# effort (data-sovereignty motivated, see
# docs/superpowers/specs/2026-08-08-custom-tesseract-ocr-design.md).
# Holds labeled real-document training pairs AND the resulting
# .traineddata model file. NEITHER may ever be committed to git — this
# bucket is the storage boundary for real client legal-process content
# used in training. Access is admin/manager-gated at the route layer
# (see src/routes/tesseractOcr.ts), matching the pattern already used
# for PDF Tools encryption in src/routes/pdfTools.ts.
[[r2_buckets]]
binding = "TESSERACT_TRAINING"
bucket_name = "rmpg-flex-tesseract-training"

# ─── Analytics lakehouse (R2 Data Catalog / Pipelines) ─────
# OPTIONAL until provisioned. The ALPR dual-write (src/routes/alpr.ts) and the
# query routes (src/routes/analytics.ts) BOTH no-op / 503 while these are unset,
# so this is safe to deploy before the pipeline exists.
#
# One-time operator setup:
#   1. npx wrangler pipelines setup
#        Simple mode creates the R2 bucket (e.g. rmpg-flex-analytics), enables
#        R2 Data Catalog, and makes a stream + sink writing the Iceberg table
#        `default.alpr_reads`. Note the printed STREAM_ID and WAREHOUSE
#        (WAREHOUSE = "<account_id>_<bucket>").
#        Recommended structured-stream schema (matches alprReadEvent in
#        src/utils/analytics.ts): event_type(string), occurred_at(string),
#        captured_by(int64,opt), source(string), capture_id(int64,opt),
#        call_id(int64,opt), incident_id(int64,opt), plate(string),
#        raw_plate(string,opt), state(string,opt), make/model/color/vehicle_type
#        (string,opt), year(string,opt), trust(float64,opt),
#        vehicle_record_id(int64,opt), lat/lng(float64,opt),
#        location_text(string,opt), hit_count(int64), critical_hit(bool).
#   2. Uncomment the [[pipelines]] block below and set stream = "<STREAM_ID>".
#   3. Set R2_ANALYTICS_WAREHOUSE in [vars] below to the printed WAREHOUSE.
#   4. npx wrangler secret put R2_SQL_TOKEN
#        API token with: R2 SQL (read) + R2 Data Catalog (read) + R2 (read) on
#        the analytics bucket.
#   5. Redeploy. Verify: GET /api/analytics/health → query_ready:true.
#
#   6. (System-wide events) Run `wrangler pipelines setup` AGAIN, pointing it at
#        the SAME analytics bucket/catalog, writing a SECOND Iceberg table
#        `default.flex_events`. Uncomment the EVENTS block below + set its stream.
#        This one table is fed by GPS/AVL, calls-for-service, citations,
#        incidents, patrol scans, and DAR (see flexEvent in src/utils/analytics.ts).
#        Recommended structured schema: event_type(string), occurred_at(string),
#        actor_id(int64,opt), source(string,opt), entity_type(string,opt),
#        entity_id(string,opt), unit_id(string,opt), lat/lng(float64,opt),
#        status(string,opt), label(string,opt), category(string,opt),
#        priority(string,opt), value(float64,opt), payload(string,opt JSON).
#        Sharing the bucket means the SAME R2_ANALYTICS_WAREHOUSE + R2_SQL_TOKEN
#        query BOTH alpr_reads and flex_events.
#
# ── PROVISIONED 2026-07-30 ───────────────────────────────────────────────────
# Done already (non-interactively — `wrangler pipelines setup` is interactive
# and cannot be driven from CI/an agent loop):
#   ✅ R2 bucket `rmpg-flex-analytics`            (wrangler r2 bucket create)
#   ✅ R2 Data Catalog enabled on that bucket     (wrangler r2 bucket catalog enable)
#   ✅ Stream `rmpg_alpr_reads`   id 940a2ab71ee54ace9e534fd91e342f89
#   ✅ Stream `rmpg_flex_events`  id 622585b17623479190bbecb141d606ce
#      Schemas are version-controlled at scripts/analytics/*.schema.json
#   ✅ R2_ANALYTICS_WAREHOUSE var set in [vars] below.
#
# REMAINING — all three need a Cloudflare API token, which must be minted in the
# dashboard (there is no wrangler command for it):
#
#   1. Create an API token with `R2 Data Catalog (edit)` + `R2 (edit)` on the
#      rmpg-flex-analytics bucket. Then create one sink per Iceberg table:
#        npx wrangler pipelines sinks create rmpg_alpr_sink \
#          --type r2-data-catalog --bucket rmpg-flex-analytics \
#          --namespace default --table alpr_reads \
#          --catalog-token <TOKEN> --roll-interval 300
#        npx wrangler pipelines sinks create rmpg_events_sink \
#          --type r2-data-catalog --bucket rmpg-flex-analytics \
#          --namespace default --table flex_events \
#          --catalog-token <TOKEN> --roll-interval 300
#
#   2. Create one pipeline per stream→sink pair:
#        npx wrangler pipelines create rmpg_alpr_pipeline \
#          --sql "INSERT INTO rmpg_alpr_sink SELECT * FROM rmpg_alpr_reads"
#        npx wrangler pipelines create rmpg_events_pipeline \
#          --sql "INSERT INTO rmpg_events_sink SELECT * FROM rmpg_flex_events"
#
#   3. Create a SECOND, read-only token (`R2 SQL (read)` + `R2 Data Catalog
#      (read)` + `R2 (read)`) for querying, then:
#        npx wrangler secret put R2_SQL_TOKEN
#
# Then UNCOMMENT the two binding blocks below and redeploy. Verify with
# GET /api/analytics/health → query_ready:true.
#
# Leave them commented until the sinks + pipelines exist: emitAnalytics() would
# otherwise write into a stream with no sink, and the rows would be discarded
# rather than landing in Iceberg — silent data loss that looks like success.
#
# [[pipelines]]
# binding = "ANALYTICS"
# stream  = "940a2ab71ee54ace9e534fd91e342f89"
#
# [[pipelines]]
# binding = "EVENTS"
# stream  = "622585b17623479190bbecb141d606ce"

# ─── PDF Tools Container (RE-ENABLED, retest 2026-08-08 v2) ─
# Two real, now-resolved blockers were found and fixed for this container:
#   1. CLOUDFLARE_API_TOKEN_2 (deploy.yml's token) lacked Containers +
#      Zone Workers Routes permission — fixed by rotating to a token with
#      both scopes.
#   2. A stale orphaned application (id a035aba5-866e-41e1-b22b-08d27b13c296,
#      durable_objects.namespace_id 53dbc886c9874ee48f8905bbafa14a0d) was
#      left over from an early attempt and blocked every deploy with
#      "already an application ... associated with a different durable
#      object namespace". Deleted directly via the Containers API
#      (DELETE /accounts/{id}/containers/applications/{app_id}) after
#      confirming its identity unambiguously from the API's JSON response
#      (NOT the dashboard UI, which visually listed it next to an unrelated,
#      live, actively-serving container of a similar name on a different
#      project's Worker — a prior attempt via the dashboard accidentally
#      deleted that unrelated container instead).
#
# The DO binding + migration tag MUST stay — removing the migration
# tag breaks the prefix chain (v1-pdftools → v2-voicehub → v3-alerthub),
# and the binding is referenced in src/types.ts + route handlers
# (calls are guarded by try/catch so they degrade gracefully).
[[containers]]
class_name = "PdfToolsContainer"
image = "./containers/pdf-tools/Dockerfile"
max_instances = 3
instance_type = "basic"

[[durable_objects.bindings]]
name = "PDF_TOOLS"
class_name = "PdfToolsContainer"

# ─── Custom Tesseract OCR Container ─────────────────────────
# Self-hosted, fine-tuned OCR — data-sovereignty motivated (see
# docs/superpowers/specs/2026-08-08-custom-tesseract-ocr-design.md).
# NOT wired into production callAi()/extractVision() — this is a
# measurable A/B candidate only (see scripts/serve-intake-vision-ab.ts),
# per the design's evidence-gated non-goal.
[[containers]]
class_name = "TesseractOcrContainer"
image = "./containers/tesseract-ocr/Dockerfile"
max_instances = 3
instance_type = "basic"

[[durable_objects.bindings]]
name = "TESSERACT_OCR"
class_name = "TesseractOcrContainer"

[[migrations]]
tag = "v1-pdftools"
new_sqlite_classes = ["PdfToolsContainer"]

# VoiceHubDO — MUST be the LAST migration. Cloudflare requires the
# already-applied tags ([v1, v1-pdftools] on the live worker) to be a
# prefix of this list, so new DO migrations are APPENDED, never inserted
# mid-list. A prior insert between v1 and v1-pdftools failed deploy with
# "class VoiceHubDO is not currently configured to implement Durable
# Objects" [code 10061].
[[migrations]]
tag = "v2-voicehub"
new_sqlite_classes = ["VoiceHubDO"]

# AlertHubDO — APPENDED (same prefix rule as v2-voicehub above: live tags
# must be a prefix of this list, so new DO migrations go at the END, never
# mid-list). SQLite-backed for free-plan compatibility + storage.put/getAlarm.
[[migrations]]
tag = "v3-alerthub"
new_sqlite_classes = ["AlertHubDO"]

[[migrations]]
tag = "v4-deepresearch"
new_sqlite_classes = ["DeepResearchDO"]

# FlexCamRemuxDO — APPENDED (same prefix rule as v2-voicehub: live tags
# must be a prefix of this list, so new DO migrations go at the END).
# SQLite-backed for free-plan + storage.put/getAlarm.
[[migrations]]
tag = "v5-flexcamremux"
new_sqlite_classes = ["FlexCamRemuxDO"]

# PersonIntelDO — APPENDED (prefix rule: live tags must be a prefix of this
# list). One instance per dossier_id; alarm-driven multi-phase intelligence
# pipeline. SQLite-backed for free-plan compatibility.
[[migrations]]
tag = "v6-personinteldo"
new_sqlite_classes = ["PersonIntelDO"]

# WebBrowserSessionDO — APPENDED (same prefix rule as v2-voicehub above: live
# tags must be a prefix of this list, so new DO migrations go at the END,
# never mid-list). SQLite-backed for free-plan compatibility.
[[migrations]]
tag = "v7-webbrowsersession"
new_sqlite_classes = ["WebBrowserSessionDO"]

# TesseractOcrContainer — APPENDED (same prefix rule as v2-voicehub above:
# live tags must be a prefix of this list, so new DO migrations go at the
# END, never mid-list). SQLite-backed for free-plan compatibility.
[[migrations]]
tag = "v8-tesseractocr"
new_sqlite_classes = ["TesseractOcrContainer"]

# ─── Workers AI ────────────────────────────────────────────
# Used by /api/serve-intake/scan-document + /api/serve-intake/upload
# for structured field extraction from OCR text and direct vision-LLM
# OCR on uploaded images. Models in use:
#   • @cf/meta/llama-3.3-70b-instruct-fp8-fast — structured field
#     extraction over Tesseract output (legal-document JSON schema).
#   • @cf/meta/llama-3.2-11b-vision-instruct — single-pass vision OCR
#     for uploaded images (skips the Tesseract step entirely).
[ai]
binding = "AI"

# ─── Observability (Workers Logs) ──────────────────────────
# Persists this worker's console.log/error output to Workers Logs
# (7-day retention, queryable in the dashboard). Without this, the
# scheduled-sweep + route handler logs (e.g. the DL-scan / properties
# 500s) are only visible via live `wrangler tail` and vanish after.
# head_sampling_rate = 1 → log 100% of requests; fine at single-agency
# volume (well inside the 20M logs/day included tier). Lower it toward
# 0.1 only if log spend ever becomes a concern.
[observability]
enabled = true
head_sampling_rate = 1

# Environment variables
[vars]
# ─── Turso secondary DB — set via `wrangler secret put`, NOT wrangler.toml ──
# TURSO_URL          libsql://rmpg-flex-secondary-rmpg-utah.turso.io
# TURSO_AUTH_TOKEN   Turso auth token (turso.tech dashboard → database → tokens)
# Both must also be added to .dev.vars for local development.
# Without them the dual-write wrapper is a null no-op — local dev is unaffected.
NODE_ENV = "production"
PRIMARY_DOMAIN = "rmpgutah.us"
CORS_ORIGINS = "https://rmpgutah.us,https://www.rmpgutah.us,http://localhost:5173"
JWT_ACCESS_EXPIRY = "15m"
JWT_REFRESH_EXPIRY = "7d"
SERVER_TIMEZONE = "America/Denver"
# Cloudflare account id (from the R2 S3-compatible endpoint host) — not
# secret. Used by src/utils/r2Presign.ts to build the presigned-PUT host
# for both R2 buckets (rmpg-flex-uploads, system-essentials).
R2_ACCOUNT_ID = "5caa95c5789f4fc4ed3934b2a2c29ed4"
# Analytics lakehouse warehouse id (= "<account_id>_<bucket>"). Provisioned
# 2026-07-30: R2 bucket `rmpg-flex-analytics` created (location wnam) and R2
# Data Catalog enabled on it.
#   Catalog URI: https://catalog.cloudflarestorage.com/5caa95c5789f4fc4ed3934b2a2c29ed4/rmpg-flex-analytics
# Setting this alone is INERT and safe: src/routes/analytics.ts requires BOTH
# this var and the R2_SQL_TOKEN secret, and returns 200 {ok:false,
# code:'not_configured'} until both are present.
R2_ANALYTICS_WAREHOUSE = "5caa95c5789f4fc4ed3934b2a2c29ed4_rmpg-flex-analytics"
# Fleet.io integration (PR 1+). Base URL of the Fleet.io REST API v1.
# Override in dev/test via .dev.vars. Set FLEETIO_API_KEY, FLEETIO_ACCOUNT_TOKEN,
# and FLEETIO_WEBHOOK_SECRET via `npx wrangler secret put <NAME>` (PR 4 adds the
# webhook receiver that needs the third one).
FLEETIO_API_BASE = "https://secure.fleetio.com/api/v1"

# Dialer OIDC (relying-party config for src/routes/ssoAuth.ts, mounted at
# /api/oidc/dialer — see src/routesConfig.ts). Issuer is the dialer's
# well-known discovery DOCUMENT URL, not a bare issuer -- the relying party
# fetches it and reads authorization_endpoint/token_endpoint/jwks_uri from
# the real response (see src/utils/sso.ts). Client ID is not sensitive so
# it lives here as a plain var.
# DIALER_OIDC_CLIENT_SECRET is set via
# `npx wrangler secret put DIALER_OIDC_CLIENT_SECRET` — never in this file.
DIALER_OIDC_ISSUER = "https://dialer.rmpgutah.us/api/oidc/.well-known/openid-configuration"
DIALER_OIDC_CLIENT_ID = "flex-ceb1d9a685995b45"
# Browser callbacks must hit rmpgutah.us/api/* (zone proxy + WAF cookie).
# api.rmpgutah.us is the managed-challenge host except /api/health.
# Re-register this URI on the Dial Connect OIDC client if it still lists the API hostname.
DIALER_OIDC_REDIRECT_URI = "https://rmpgutah.us/api/oidc/dialer/callback"
# The SPA origin the /login and /oidc-callback redirects in src/routes/oidc.ts
# land on. Without this, oidc.ts falls back to the Worker's own request URL
# (api.rmpgutah.us), which has no /login route -> 404.
APP_ORIGIN = "https://rmpgutah.us"
# Dial Connect CFS status sync (POST /api/dispatch/calls/:id/status).
# Secret is `npx wrangler secret put DIAL_CONNECT_WEBHOOK_SECRET`.
DIAL_CONNECT_WEBHOOK_URL = "https://dialer.rmpgutah.us/api/webhooks/flex/cfs-status"

# NSOPW nationwide SOR (mig 0146 + 0147). The federated search endpoint at
# nsopw-api.ojp.gov is technically public + CORS-restricted; nsopw.gov's
# Conditions of Use likely prohibit programmatic access regardless. The
# integration is opt-in via NSOPW_ENABLED — sworn LE operators accept the
# ToU posture explicitly by setting this. Without it, every NSOPW path
# returns configured=false and the framework surfaces a coverage gap
# (NEVER a clearance) — the false-clear guard stays intact.
# Spec: docs/superpowers/specs/2026-06-22-nationwide-sor-nsopw-design.md
NSOPW_ENABLED = "1"

# Microsoft 365 / Azure AD app registration (optional — Admin → Email tab
# also stores encrypted copies in D1). Set client id + tenant as plain vars;
# client secret via `wrangler secret put MS_EMAIL_CLIENT_SECRET`.
# MS_EMAIL_CLIENT_ID = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# MS_EMAIL_TENANT_ID = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# Secrets (set via `npx wrangler secret put`)
# JWT_SECRET (already set)
# GOOGLE_MAPS_API_KEY
# RECOVERY_KEY              Account recovery key — POST /api/auth/recover-all with X-Recovery-Key header
#  - FLEETIO_API_KEY         Fleet.io API key (Token-style; app.fleetio.com/settings/api_keys)
#  - FLEETIO_ACCOUNT_TOKEN   Fleet.io Account-Token (per-account; same settings page)
#  - FLEETIO_WEBHOOK_SECRET  Fleet.io webhook signing secret (PR 4; set when webhooks are wired)
#  - MS_EMAIL_CLIENT_SECRET   Azure AD client secret (paired with MS_EMAIL_CLIENT_ID / MS_EMAIL_TENANT_ID vars above)

# Scheduled cron triggers.
# Utah warrant smoke poll runs every 4h, matching the legacy server's
# scheduleUtahWarrantSync interval. Workers cron uses UTC; "0 */4 * * *"
# means every 4 hours on the hour (00:00, 04:00, 08:00, ... UTC).
# "0 3 1 * *" — Fleet.io PR 2: monthly NHTSA vPIC bulk-export refresh of
# ref_vehicle_makes / ref_vehicle_models / xref_model_year_to_specs. PR 2
# wires the trigger with a stub handler; the real bulk-import lands in PR 2b.
[triggers]
crons = ["0 */4 * * *", "* * * * *", "*/30 * * * *", "0 3 1 * *", "0 9 * * *"]

# (Removed obsolete deleted_classes migration. The class is now properly
