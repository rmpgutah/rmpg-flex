# /etc/rmpg-desktop/apps.conf — the Start menu.
#
# Format:  Name | command | icon-name | admin_only
#
# This file IS the lockdown policy. rmpg-shell serves exactly these entries and
# nothing else, so an officer cannot launch software that policy did not put
# here. Entries with admin_only=1 are hidden unless the shell was started with
# --admin (see /etc/rmpg-desktop/xinitrc), which keeps diagnostic tooling off a
# fielded terminal without maintaining two separate images.
#
# Order matters — this is the order they appear in the menu.

RMPG Flex Console|rmpg-browser --app=https://rmpgutah.us|applications-internet|0
Web Browser|rmpg-browser|web-browser|0
Files|pcmanfm|system-file-manager|0
PDF Viewer|mupdf|application-pdf|0
Image Viewer|feh --scale-down --auto-zoom /root|image-x-generic|0

# Admin / diagnostic tools — hidden on fielded terminals.
Terminal|xterm -bg black -fg white -fa Monospace -fs 11|utilities-terminal|1
Task Manager|xterm -title "Task Manager" -e htop|utilities-system-monitor|1
Text Editor|xterm -title "Text Editor" -e nano|accessories-text-editor|1
File Manager (console)|xterm -title "Midnight Commander" -e mc|system-file-manager|1
