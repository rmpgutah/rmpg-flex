# /etc/X11/xorg.conf — RMPG Flex Desktop display configuration.
#
# Pins the modesetting driver to the first DRM device instead of relying on
# X.Org's PCI autoconfiguration.
#
# WHY THIS FILE IS REQUIRED
# Without it X dies at startup with the famously unhelpful:
#
#     (EE) Fatal server error:
#     (EE) no screens found
#
# X.Org autoconfiguration enumerates PCI devices and selects one whose class
# is "VGA compatible controller" (0x0300). QEMU launched with `-vga none
# -device virtio-gpu-pci` — which this project's test harness does, because a
# real VGA adapter shadows the virtio device during screenshot capture —
# presents the GPU as a plain "Display controller" (0x0380) instead. X finds no
# VGA-class device, concludes there is no graphics hardware, and exits, even
# though /dev/dri/card0 is present and fully working.
#
# That the DRM device was fine all along is easy to confirm: the previous
# fullscreen kiosk browser rendered through it perfectly, because it talks to
# DRM/KMS directly and never consults the PCI class.
#
# Naming the driver and the device explicitly sidesteps the probe entirely.
# This is also correct on the Panasonic FZ-55, whose Intel iGPU does report the
# VGA class and would have autodetected — pinning it simply makes QEMU and real
# hardware take the identical path, so a display problem seen on one is
# reproducible on the other.

# Load glamor BEFORE the display driver is probed. This is not optional here,
# and it is the actual reason X refused to start.
#
# Buildroot builds modesetting_drv.so with twelve UNDEFINED gbm_* symbols and
# does not link it against libgbm (verified with readelf: its only NEEDED
# entries are libudev, libm and libc). Mainstream distributions link libgbm
# into the driver directly; this build does not. The symbols live in
# libglamoregl.so, which DOES link libgbm — but Xorg probes display drivers
# before it initialises glamor, so at dlopen time nothing in the process
# provides them and the load fails:
#
#   (EE) Failed to load modesetting_drv.so: undefined symbol: gbm_bo_get_plane_count
#   (EE) No drivers available.
#   (EE) no screens found
#
# "no screens found" reads like missing hardware, which sent two earlier fixes
# (DRM master contention, then PCI device class) after the wrong cause entirely.
# The device was never the problem: /dev/dri/card0 is present and the previous
# kiosk browser rendered through it perfectly.
#
# Loading glamoregl explicitly pulls libgbm into the process first — X loads
# modules with globally visible symbols, so the driver then resolves cleanly.
Section "Module"
    Load        "glamoregl"
EndSection

Section "Device"
    Identifier  "GPU0"
    Driver      "modesetting"
    # Explicit device node: with several DRM devices present (an FZ-55 docked
    # to an external GPU, say) autodetection could otherwise pick the wrong one.
    Option      "kmsdev" "/dev/dri/card0"
    # Software rendering path. Under QEMU without virgl there is no hardware
    # GL, and glamor would fail to initialise and take the whole server down
    # with it. Mesa's llvmpipe handles the compositing this desktop needs, and
    # on the FZ-55 the iris driver provides real acceleration to the
    # applications regardless of this setting.
    Option      "AccelMethod" "none"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "GPU0"
    # 24-bit colour: the kiosk UI is flat colour and text, so 32-bit buys
    # nothing and costs bandwidth on the emulated device.
    DefaultDepth 24
    SubSection "Display"
        Depth   24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "Layout0"
    Screen  0   "Screen0"
EndSection

Section "ServerFlags"
    # A kiosk terminal must never blank or suspend the display — an officer
    # glancing at a dark screen has no way to tell it apart from a dead one.
    Option      "BlankTime"   "0"
    Option      "StandbyTime" "0"
    Option      "SuspendTime" "0"
    Option      "OffTime"     "0"
    # No Ctrl+Alt+Backspace kill switch on a fielded terminal.
    Option      "DontZap"     "true"
EndSection
