name: Desktop Build

# Builds the Windows Electron installer and publishes it to the auto-update
# feed whenever desktop source changes land on main. This is the continuous
# delivery path; the sister workflow (desktop-release.yml) is the manual /
# tag-gated release path. Both publish to the same R2 feed, so the most
# recent successful build is always what electron-updater pulls.
#
# Path filter: only runs when files under desktop/ change — avoids spending
# 15-20 minutes on a native Windows build for Worker-only or client-only PRs.
#
# Why windows-latest: native C++ modules (serialport, better-sqlite3) must be
# compiled for win32-x64 against Electron's Node ABI. A Linux/macOS builder
# ships wrong-arch bindings that crash require('serialport') on the Toughbook.

on:
  push:
    branches: [main]
    paths: ['desktop/**']

concurrency:
  group: desktop-build-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      - name: Publish to R2 update feed
        working-directory: desktop/dist
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $bucket = "rmpg-flex-downloads"
          $exe = Get-ChildItem -Filter "RMPG-Flex-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No RMPG-Flex-Setup-*.exe found in desktop/dist" }
          if (-not (Test-Path "latest.yml")) { throw "latest.yml not generated by electron-builder" }
          $exeName = $exe.Name
          Write-Host "Publishing $exeName to $bucket/updates/"
          npx --yes wrangler@4 r2 object put "$bucket/updates/$exeName" --file "$exeName" --remote
          if (Test-Path "$exeName.blockmap") {
            npx --yes wrangler@4 r2 object put "$bucket/updates/$exeName.blockmap" --file "$exeName.blockmap" --remote
          }
          npx --yes wrangler@4 r2 object put "$bucket/updates/latest.yml" --file "latest.yml" --remote --content-type "text/yaml"

      - name: Verify feed
        shell: bash
        run: |
          echo "--- https://api.rmpgutah.us/updates/latest.yml ---"
          curl -sS https://api.rmpgutah.us/updates/latest.yml || true
