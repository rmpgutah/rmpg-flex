name: ios2 tests (RMPG Flex Connect)

on:
  push:
    branches: [main]
    paths:
      - 'ios2/**'
      - '.github/workflows/ios2-tests.yml'
  pull_request:
    paths:
      - 'ios2/**'
      - '.github/workflows/ios2-tests.yml'

# Least-privilege GITHUB_TOKEN (CWE-275). Swift test job needs only read access.
permissions:
  contents: read

jobs:
  swift-tests:
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Host-safe packages, including CoreCarPlay's call-list / nav / reply
        # tests. CarPlaySceneDelegate.swift stays excluded from SPM (CarPlay.framework
        # is iOS-only); swift-build-carplay compiles the rest of that package
        # with the iOS Simulator SDK.
        package: [CoreAPI, CoreAuth, CoreCarPlay, DesignSystem, FeatureShell]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode (pinned to the GitHub macos-14 default)
        run: |
          # macos-14 ships several Xcode versions. Prefer 15.4 if present.
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          swift --version

      - name: Show swift package layout
        working-directory: ios2/RMPGFlexConnect/Packages/${{ matrix.package }}
        run: ls -la

      - name: Test ${{ matrix.package }}
        working-directory: ios2/RMPGFlexConnect/Packages/${{ matrix.package }}
        run: swift test --enable-test-discovery

  # CoreCarPlay's Package.swift excludes CarPlaySceneDelegate.swift from the
  # host `swift test` target (CarPlay.framework is iOS-only). Building the
  # package with xcodebuild for the iOS Simulator compiles the rest of the
  # module with an iOS SDK. Do NOT point this job at RMPGFlexConnect.xcodeproj
  # — that project is created locally in Xcode (README Task 6) and is not in
  # git; looking for it was a hard exit 66 on every ios2 PR.
  swift-build-carplay:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode (pinned to the GitHub macos-14 default)
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Build CoreCarPlay package for iOS Simulator
        working-directory: ios2/RMPGFlexConnect/Packages/CoreCarPlay
        run: |
          set -euo pipefail
          xcodebuild -list
          xcodebuild build \
            -scheme CoreCarPlay \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
