name: fleet-ui-coverage

on:
  pull_request:
    paths:
      - 'client/src/pages/fleet/**'
      - 'migrations/**'

# Principle-of-least-privilege: jobs only read the checked-out source.
# No deploy, no comment-on-PR, no write to anywhere. CodeQL recommendation.
permissions:
  contents: read

jobs:
  no-ddl-guard:
    name: No DDL in fleet-ui PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Block any new migrations file IF this is a fleet-UI PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # General policy: PRs that touch the fleet UI shouldn't also sneak in
          # schema changes — DDL review deserves its own PR. The guard only
          # fails when a PR touches BOTH fleet-UI files AND adds a migration;
          # a pure backend migration PR (that doesn't touch fleet UI) gets a
          # green pass-through.
          touches_fleet_ui=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            'client/src/pages/fleet/**' ':!client/src/pages/fleet/**/__tests__/**' \
            | head -1 | tr -d '[:space:]')
          if [ -z "$touches_fleet_ui" ]; then
            echo "OK: PR does not touch fleet-UI files (client/src/pages/fleet/**); DDL guard does not apply."
            exit 0
          fi
          new_migrations=$(git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" -- 'migrations/*.sql' | tr -d '[:space:]')
          if [ -n "$new_migrations" ]; then
            echo "::error::Fleet-UI PR may not add migrations. Found new files:"
            git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" -- 'migrations/*.sql'
            exit 1
          fi
          echo "OK: no new migrations in this PR."
