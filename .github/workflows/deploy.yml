name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege GITHUB_TOKEN (CWE-275). Deploys run against Cloudflare using
# CLOUDFLARE_* secrets, not the GITHUB_TOKEN — nothing here pushes commits,
# creates releases, or comments, so read-only is sufficient.
permissions:
  contents: read

jobs:
  # ── Gate: typecheck + fast tests ─────────────────────────────────────────────
  # Runs before any deployment step. workflow_dispatch bypasses PR CI, so we
  # replicate the fast checks here to ensure no untested code reaches production.
  # Full test suite (client-tests 60 min, PDF, maps, desktop, E2E) lives in
  # pr-tests.yml and is the mandatory gate for merging to main.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Typecheck (Worker — src/)
        run: npx tsc --noEmit

      - name: Worker unit tests
        run: npx vitest run
        timeout-minutes: 15

      - name: Install client deps
        run: cd client && npm ci --legacy-peer-deps

      - name: Typecheck (Client — client/src/)
        run: cd client && npx tsc --noEmit

      - name: Client build verification
        run: cd client && npx vite build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
        timeout-minutes: 10

      - name: Dependency security audit (Worker)
        # High/critical advisories block; moderate/low are advisory.
        # If a high-severity advisory has no upstream fix, override via
        # .nsprc or npm audit --omit=dev after documenting the exception.
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── Deploy ────────────────────────────────────────────────────────────────────
  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Worker source lives at /src/ with root package.json.
      - name: Install root deps
        run: npm ci

      # Schema drift check — verifies every CREATE TABLE and ALTER TABLE from
      # migration files exists on live D1. Catches the continue-on-error trap:
      # if a migration's DDL never actually landed (wrangler swallowed the
      # error), this step fails loudly. Override with SKIP_DRIFT_CHECK=1 for
      # emergency hotfixes where schema drift is intentional.
      - name: Schema drift check (remote D1)
        if: ${{ vars.SKIP_DRIFT_CHECK != '1' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: DB_MODE=remote scripts/check-migration-drift.sh

      # Apply D1 migrations to live (`rmpg-flex` DB, 785de7ae-…).
      #
      # Do NOT use a single `wrangler d1 migrations apply`: it stops the whole
      # pending batch on the first error. Live already has
      # time_entries.starting_mileage, so 0227 fails with "duplicate column"
      # and every later file (0265 person-intel tables, 0269 skiptracer v2,
      # 0270 tesseract page_number, …) never runs — Worker+Pages still ship,
      # so the features look deployed while they 500 on missing schema.
      # scripts/d1PendingMigrations.ts applies one statement at a time,
      # ignores duplicate-column / already-exists, and never executes
      # remote-unsafe table rebuilds (DROP TABLE calls_for_service).
      #
      # continue-on-error: true remains so a genuine later-file failure cannot
      # block Worker + Pages. The blocking schema verification step below catches
      # any critical table that failed to land. Always verify with
      # pragma_table_info after merge.
      - name: Apply D1 migrations (remote)
        continue-on-error: true
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/d1PendingMigrations.ts --remote

      # Blocking schema verification — confirms that tables which are required
      # for live CAD/RMS operations actually exist on D1 before the Worker
      # receives traffic. A failed migration that the step above swallowed is
      # caught here rather than at runtime (a 500 on /api/dispatch/calls during
      # an active incident). Override with SKIP_SCHEMA_VERIFY=1 only for
      # emergency hotfixes where you know the schema is intact.
      - name: Verify critical schema (post-migration)
        if: ${{ vars.SKIP_SCHEMA_VERIFY != '1' }}
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CRITICAL_TABLES=(
            calls_for_service
            units
            persons
            warrants
            audit_log
            users
            dispatch_notes
            alpr_captures
          )
          MISSING=()
          for table in "${CRITICAL_TABLES[@]}"; do
            # wrangler d1 execute writes progress banners to stdout alongside the
            # JSON result, so json.load(stdin) always throws on the raw stream.
            # grep -o '\[.*\]' isolates the JSON array line before Python sees it.
            COUNT=$(npx wrangler d1 execute rmpg-flex --remote \
              --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name='${table}'" \
              2>/dev/null \
              | grep -o '\[.*\]' \
              | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              n = data[0]['results'][0]['n'] if data else 0
              print(n)
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
            if [ "$COUNT" = "0" ]; then
              MISSING+=("$table")
              echo "::error::Critical table '$table' is absent from live D1 — migration may have silently failed"
            else
              echo "  ✓  $table"
            fi
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo ""
            echo "::error::Schema verification failed — missing tables: ${MISSING[*]}"
            echo "Run: scripts/apply-migration.sh <migration>.sql for each missing table"
            echo "Then re-run this workflow. Use SKIP_SCHEMA_VERIFY=1 only for emergencies."
            exit 1
          fi
          echo "Schema verification passed (${#CRITICAL_TABLES[@]} critical tables confirmed)."

      - name: Apply migrations to Turso secondary
        continue-on-error: true
        timeout-minutes: 3
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # Pin the Turso CLI version and verify the checksum instead of piping
          # an unverified remote script to bash — the curl|bash pattern lets a
          # compromised or MITM'd get.tur.so serve arbitrary code with full access
          # to all in-scope secrets.
          TURSO_VERSION="v0.96.1"
          TURSO_ARCHIVE="turso_linux_amd64.tar.gz"
          TURSO_URL="https://github.com/tursodatabase/turso-cli/releases/download/${TURSO_VERSION}/${TURSO_ARCHIVE}"
          CHECKSUMS_URL="https://github.com/tursodatabase/turso-cli/releases/download/${TURSO_VERSION}/checksums.txt"
          curl -sSfL "${TURSO_URL}" -o "${TURSO_ARCHIVE}"
          # Fetch the real checksum from the release's checksums.txt and verify.
          TURSO_SHA256=$(curl -sSfL "${CHECKSUMS_URL}" | grep "${TURSO_ARCHIVE}" | awk '{print $1}')
          if [ -z "${TURSO_SHA256}" ]; then
            echo "::error::Could not fetch Turso CLI checksum from release — possible MITM or release changed"
            exit 1
          fi
          echo "${TURSO_SHA256}  ${TURSO_ARCHIVE}" | sha256sum -c - || {
            echo "::error::Turso CLI checksum mismatch — possible MITM or corrupt download"
            exit 1
          }
          tar -xzf "${TURSO_ARCHIVE}" turso
          chmod +x turso
          for f in migrations/*.sql; do
            ./turso db shell rmpg-flex-secondary < "$f" || \
              echo "::warning::Migration $f failed on Turso secondary (non-blocking)"
          done

      - name: Fetch Tesseract model
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/fetch-tesseract-model.sh

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Containers (pdf-tools, tesseract-ocr) are already deployed separately.
          # Skip container build/rollout in CI to avoid needing Docker on the runner.
          command: deploy --containers-rollout=none

      # Client SPA build + deploy to Cloudflare Pages.
      # Without these steps the Worker (API) ships but the React app
      # at https://rmpgutah.us stays stuck on whatever bundle was
      # last pushed manually. Incident 2026-05-24: SW v321 lived in
      # prod for weeks while source moved to v563 because deploy.yml
      # only ran the Worker step. All UI fixes silently rotted.
      - name: Install client dependencies
        run: cd client && npm ci --legacy-peer-deps

      - name: Build client
        run: cd client && npm run build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}

      - name: Stage Pages Functions
        run: |
          set -euo pipefail
          if [ ! -d "client/dist" ]; then
            echo "::error::client/dist not found — client build must have failed"
            exit 1
          fi
          if [ ! -d "functions" ]; then
            echo "::error::functions/ directory not found at repo root — Pages Functions are missing"
            exit 1
          fi
          cp -r functions/ client/dist/functions/

      - name: Deploy client to Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: client/dist
          command: pages deploy . --project-name=rmpg-flex --branch=main --commit-dirty=true

      # Deploy the routing proxy (rmpg-api-proxy) LAST. It dispatches
      # rmpgutah.us/api/* to the rewrite (env.API = rmpg-flex-api) or legacy
      # (env.LEGACY = rmpg-flex); both service-binding targets are already
      # deployed above by the time this runs.
      #
      # BLOCKING (no continue-on-error): PR #947 cleared the orphan DO namespace
      # issue (WelfareWatchDO/VoiceHubDO/AlertHubDO/PdfToolsContainer) that
      # required the 2026-06-02 hedge. If 10064 returns, do NOT re-add
      # continue-on-error — confirm proxy/index.ts still exports the four stub
      # classes. See memory project-auth-outage-name-collision.
      #
      # `if: success()` (default): deploying the proxy when the Worker itself
      # failed would wire the proxy to a Worker version that was never reached.
      - name: Deploy proxy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: proxy
          command: deploy

      # Post-deploy verification — smoke-test the Worker health endpoint.
      # This catches deploy failures that return a non-2xx Wrangler exit code
      # but still "succeed" because the old Worker version keeps serving traffic.
      - name: Verify Worker health
        if: always() && vars.SKIP_VERIFY != '1'
        run: |
          set -euo pipefail
          echo "Verifying Worker health..."
          HEALTH=$(curl -sf --max-time 10 https://api.rmpgutah.us/api/health)
          STATUS=$(echo "$HEALTH" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))")
          VERSION=$(echo "$HEALTH" | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))")
          if [ "$STATUS" != "ok" ] && [ "$STATUS" != "degraded" ]; then
            echo "ERROR: unexpected status: $STATUS"
            exit 1
          fi
          echo "Worker health OK: status=$STATUS, version=$VERSION"
