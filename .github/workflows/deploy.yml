name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Apply D1 migrations to live (`rmpg-flex` DB, 785de7ae-…).
      #
      # `continue-on-error: true` (restored 2026-05-31). A non-blocking
      # apply was the long-standing posture; it was tightened to blocking
      # on 2026-05-27 on the assumption that only clean new migrations
      # remained. That assumption was wrong: two pre-existing seed
      # migrations (0049_admin_settings.sql / 0050_advanced_settings.sql)
      # contain a malformed multi-row INSERT ("all VALUES must have the
      # same number of terms") that has NEVER applied. Because wrangler
      # applies migrations in order and aborts on the first failure, that
      # one broken seed blocked the ENTIRE pipeline — including the Worker
      # deploy and the `client` Pages build — for every push since. The
      # net effect: shipped commits (e.g. the fleet toFixed crash fix)
      # never reached prod; the live bundle silently lagged main for days.
      #
      # A broken *seed* migration must not be able to gate code deploys.
      # The Worker reconciles required columns at boot, and genuinely new
      # schema is applied directly to live D1 + checked into migrations/
      # (see 0057_fleet_schema_alignment.sql). After deploy, verify any
      # new table/column landed by querying sqlite_master directly rather
      # than trusting the migration log (see CLAUDE.md gotcha #4).
      - name: Apply D1 migrations (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply rmpg-flex --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --containers-rollout=none skips the Cloudflare Containers
          # rollout. Without this, every Worker deploy fails at the
          # container image push step with a bare `Unauthorized` (the
          # image builds fine via Docker on the runner, but the push
          # to Cloudflare's registry is rejected).
          #
          # Probed 2026-05-24 with a freshly issued Account token that
          # included every Workers/D1/KV/R2/Pages scope — still
          # Unauthorized on registry push. The required permission
          # isn't surfaced by name in wrangler's error message and
          # didn't show up under any "Containers" / "Workers" scope
          # in the Cloudflare token UI at the time. Until that's
          # sorted, every route still ships; only the PdfToolsContainer
          # sidecar stays inactive (/api/pdf-tools/* will 500 if called).
          command: deploy --containers-rollout=none

      # Client SPA build + deploy to Cloudflare Pages.
      # Without these steps the Worker (API) ships but the React app
      # at https://rmpgutah.us stays stuck on whatever bundle was
      # last pushed manually. Incident 2026-05-24: SW v321 lived in
      # prod for weeks while source moved to v563 because deploy.yml
      # only ran the Worker step. All UI fixes silently rotted.
      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build client
        run: cd client && npm run build

      - name: Deploy client to Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy client/dist --project-name=rmpg-flex --branch=main --commit-dirty=true

      # Deploy the routing proxy (rmpg-api-proxy) LAST. It dispatches
      # rmpgutah.us/api/* to the rewrite (env.API = rmpg-flex-api) or legacy
      # (env.LEGACY = rmpg-flex); both service-binding targets are already
      # deployed above by the time this runs.
      #
      # BLOCKING again (no continue-on-error): the 2026-06-02 hedge was added
      # because the deployed rmpg-api-proxy had orphan Durable Object namespaces
      # (WelfareWatchDO/VoiceHubDO/AlertHubDO/PdfToolsContainer) left by the #937
      # name-collision, so every proxy deploy hit Cloudflare error 10064. PR #947
      # cleared that by exporting inert stub DO classes from proxy/index.ts, so
      # the proxy deploys cleanly now. This step is sequenced LAST specifically so
      # a genuine proxy failure fails the run loudly WITHOUT skipping the
      # worker/client/Pages deploys above (the regression #943's continue-on-error
      # was guarding against). If this 10064s again, do NOT re-add
      # continue-on-error — confirm proxy/index.ts still exports those four stub
      # classes. See memory project-auth-outage-name-collision.
      - name: Deploy proxy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: proxy
          command: deploy
