name: "Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Check dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Dependency Review
        # v5.0.0 is purely the Node 20 -> 24 runtime bump (the `@v4` tag is
        # still node20, which GitHub deprecates 2026-06-16). The earlier fear
        # that v5 would drop `deny-licenses` (actions/dependency-review-action#938)
        # did NOT materialize — v5.0.0 keeps `deny-licenses`, `fail-on-severity`,
        # and `comment-summary-in-pr` unchanged, so the block-GPL-family policy
        # below is preserved exactly.
        uses: actions/dependency-review-action@v5
        with:
          # Block PRs that add dependencies with known critical/high vulns
          fail-on-severity: high
          # Block copyleft licenses that conflict with private software
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always
