name: "Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Check dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Dependency Review
        # v5.0.0 is purely the Node 20 -> 24 runtime bump (the `@v4` tag is
        # still node20, which GitHub deprecates 2026-06-16). v5.0.0 keeps
        # `deny-licenses`, `fail-on-severity`, and `comment-summary-in-pr`
        # working, so the block-GPL-family policy below still enforces exactly.
        #
        # `deny-licenses` now emits a "deprecated for possible removal in the
        # next major release" warning on every PR summary (tracked upstream in
        # actions/dependency-review-action#997). We INTENTIONALLY keep it. There
        # is no policy-preserving successor:
        #   * `allow-licenses` is an allow-LIST — it fails on any license NOT
        #     enumerated, inverting our "block only the GPL family, permit
        #     everything else" gate into a closed allowlist that would break CI
        #     on every new/unlisted transitive license. That is a different,
        #     stricter policy we have not opted into.
        #   * `allow-dependencies-licenses` is a purl-based package-exclusion
        #     list, not a license blocker.
        #   * Moving this denylist into a `config-file` does NOT silence the
        #     warning — it fires on the merged `config.deny_licenses` value
        #     (src/summary.ts), regardless of whether the value comes from an
        #     inline input or a config file.
        # The warning is cosmetic; the check still passes and the GPL gate is
        # unchanged. Revisit only when a future major actually removes the
        # option (re-evaluate the upstream guidance in #997 at that point).
        #
        # `comment-summary-in-pr: on-failure` (was `always`): the summary
        # comment is where that cosmetic deprecation warning surfaces, and at
        # `always` it landed on every PR (noise that kept tripping CI review-
        # comment monitors). At `on-failure` the comment is posted ONLY when the
        # check actually fails (a blocked GPL license or a high-severity vuln),
        # so clean PRs — the vast majority — get no comment and no warning. The
        # denylist + fail-on-severity gate are unchanged; this only controls
        # WHEN the result is mirrored into a PR comment. Failures still comment.
        uses: actions/dependency-review-action@v5
        with:
          # Block PRs that add dependencies with known critical/high vulns
          fail-on-severity: high
          # Block copyleft licenses that conflict with private software
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure
