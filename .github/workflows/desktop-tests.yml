# Desktop Tests — runs the Electron desktop app's local `node --test` suite
# (desktop/__tests__ + desktop/security/__tests__) on every PR/push touching
# desktop/. Mirrors the "Desktop tests" step of .husky/pre-push — until now
# that hook was the ONLY place these tests ran; desktop-release.yml only
# builds/publishes the Windows installer on version tags and never calls
# `npm test`, so a contributor bypassing pre-push (--no-verify) shipped with
# zero CI coverage for desktop/.
#
# Scoped to desktop/** via path filters (unlike pr-tests.yml's jobs, which
# always run) since this suite only exercises code under desktop/.
#
# Runs on windows-latest because the desktop app is a Windows-first Electron
# app — native modules (serialport, node-hid, usb-detection) and
# platform-specific IPC handlers (WMI, PowerShell, reg.exe) only exercise
# their real code paths on Windows. ubuntu runners skip all Windows-gated
# code paths, giving zero coverage of the actual deployment target.
name: Desktop Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
  push:
    branches: [main]
    paths:
      - 'desktop/**'

concurrency:
  group: desktop-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-tests:
    name: Desktop tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: cd desktop && npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # npm ci's postinstall runs electron-rebuild, leaving better-sqlite3 built
      # for Electron's ABI. The DB-backed tests run under plain `node --test`
      # (Node's ABI), so without this they fail with a NODE_MODULE_VERSION
      # mismatch — mirrors the same rebuild .husky/pre-push does locally.
      - run: cd desktop && npm rebuild better-sqlite3
      - run: cd desktop && npm test
