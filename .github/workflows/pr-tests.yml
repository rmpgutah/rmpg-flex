# PR Tests — runs on every pull request against main.
# Mirrors .husky/pre-push but in CI so the gate is enforced even when
# a contributor bypasses the pre-push hook with --no-verify.
#
# Intentionally NOT on push:main: these are the same tsc/vitest/vite checks
# that already ran (and were required to pass) on the PR before merge, so
# re-running them post-merge just duplicates CI minutes and slows down every
# push to main. main-typecheck-guardrail.yml still re-validates worker+client
# typecheck post-merge (with auto-issue-filing) to catch the narrow case of
# concurrent merges dropping an import; deploy.yml re-typechecks + rebuilds
# the client for real as part of the deploy itself. Nothing here was uniquely
# covering a gap those two don't already close.
name: PR Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker-typecheck:
    name: Worker typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # The Worker's two suites existed, passed, and had npm scripts + configs for
  # months — but gated NOTHING. Only the bypassable husky hook ran them, so a
  # --no-verify push could land a broken Worker with all PR checks green. The
  # 2026-07-24 audit found regression guards that would never have run in CI.
  worker-tests:
    name: Worker tests
    needs: [worker-typecheck]
    runs-on: ubuntu-latest
    # Longer than the client jobs: this suite is ~250 files and the pdfSign
    # SLH-DSA cases are genuinely slow.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run

  # Route-level smoke tests against real Miniflare D1/KV/R2 bindings. Separate
  # job from the node suite because it runs in workerd, not node.
  worker-integration-tests:
    name: Worker integration tests
    needs: [worker-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:worker

  client-typecheck:
    name: Client typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx tsc --noEmit

  # The 590-file client suite OOMs the 7 GB ubuntu-latest runner. Root cause:
  # the parent vitest process accumulates Vite transform-cache entries for every
  # file in a shard; heavy library imports (Mapbox, large page trees) can push
  # this past 4 GB even after PDF tests are isolated. 8 shards ≈ 41 files each,
  # comfortably within the 4096 MB per-process ceiling.
  client-tests-1:
    name: Client tests (shard 1/8)
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --shard=1/8
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  client-tests-2:
    name: Client tests (shard 2/8)
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --shard=2/8
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  client-tests-3:
    name: Client tests (shard 3/8)
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --shard=3/8
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  client-tests-4:
    name: Client tests (shard 4/8)
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --shard=4/8
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  client-tests-5:
    name: Client tests (shard 5/8)
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --shard=5/8
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  client-tests-6:
    name: Client tests (shard 6/8)
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --shard=6/8
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  client-tests-7:
    name: Client tests (shard 7/8)
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --shard=7/8
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  client-tests-8:
    name: Client tests (shard 8/8)
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --shard=8/8
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Desktop component suite runs separately so its ~100 files don't skew
  # shard assignments for the main suite.
  client-tests-desktop:
    name: Client tests (desktop components)
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --config vitest.desktop.config.ts
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # PDF test suite runs separately — jsPDF and pdf-lib have ~10 MB parsed ASTs
  # each. When ~17 PDF test files cluster in one shard (by vitest's hash), their
  # combined transform cache inflates past the 4 GB heap limit and OOMs the
  # runner after all tests complete. Running them in their own job keeps each
  # main shard at ~64 files with a manageable transform cache.
  client-tests-pdf:
    name: Client tests (PDF suite)
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --config vitest.pdf.config.ts
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  client-build:
    name: Client build
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vite build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}

  # The proxy is a Cloudflare Worker (rmpg-api-proxy) with its own tsconfig.
  # wrangler deploy bundles it at deploy time, but nothing has ever typechecked
  # it in CI — a type error in proxy/index.ts would only surface at bundle time
  # during deploy, after the PR is already merged.
  proxy-typecheck:
    name: Proxy typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd proxy && npx tsc --noEmit

  client-entry-size:
    name: client-entry-size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - name: Build with sourcemaps
        working-directory: client
        run: npx vite build --sourcemap
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
      # Ratchet on the ENTRY chunk only — it is what gates first paint.
      # Ceiling is the 2026-07-31 optimized size (433,810 B) plus ~5% headroom.
      # If a change legitimately needs more, raise this deliberately in the
      # same PR and say why; do not silently bump it. `node scripts/measure-entry.mjs`
      # (no flag) prints the top 25 eager modules, which is usually enough to
      # see what got pulled in.
      - name: Assert entry chunk under ceiling
        working-directory: client
        run: node scripts/measure-entry.mjs --max-raw 455500
