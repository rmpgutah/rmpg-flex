# PR Tests — runs on every pull request against main.
# Mirrors .husky/pre-push but in CI so the gate is enforced even when
# a contributor bypasses the pre-push hook with --no-verify.
#
# Intentionally NOT on push:main: these are the same tsc/vitest/vite checks
# that already ran (and were required to pass) on the PR before merge, so
# re-running them post-merge just duplicates CI minutes and slows down every
# push to main. main-typecheck-guardrail.yml still re-validates worker+client
# typecheck post-merge (with auto-issue-filing) to catch the narrow case of
# concurrent merges dropping an import; deploy.yml re-typechecks + rebuilds
# the client for real as part of the deploy itself. Nothing here was uniquely
# covering a gap those two don't already close.
name: PR Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker-typecheck:
    name: Worker typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # The Worker's two suites existed, passed, and had npm scripts + configs for
  # months — but gated NOTHING. Only the bypassable husky hook ran them, so a
  # --no-verify push could land a broken Worker with all PR checks green. The
  # 2026-07-24 audit found regression guards that would never have run in CI.
  worker-tests:
    name: Worker tests
    needs: [worker-typecheck]
    runs-on: ubuntu-latest
    # Longer than the client jobs: this suite is ~250 files and the pdfSign
    # SLH-DSA cases are genuinely slow.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run

  # Route-level smoke tests against real Miniflare D1/KV/R2 bindings. Separate
  # job from the node suite because it runs in workerd, not node.
  worker-integration-tests:
    name: Worker integration tests
    needs: [worker-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:worker

  client-typecheck:
    name: Client typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx tsc --noEmit

  client-tests:
    name: Client tests
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    # maxWorkers:1 + forks is required to avoid OOM on the 7 GB runner, but
    # makes the suite wall-clock ~35–40 min. 30 was cancelling healthy green runs.
    # 2026-08-29: a worker still hit the 8192 MB V8 cap (~8.0 GB Mark-Compact)
    # after 32 min of GC, then "Worker exited unexpectedly". ubuntu-latest is
    # 16 GB now — give the parent more heap and extra wall clock so one heavy
    # file cannot fail the whole job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run
        env:
          NODE_OPTIONS: --max-old-space-size=12288

  client-pdf-tests:
    name: Client PDF tests
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --config vitest.pdf.config.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  client-map-tests:
    name: Client map tests
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --config vitest.maps.config.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  client-desktop-tests:
    name: Client desktop tests
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    # 2026-09-04: suite consistently hits 25 min across PRs #4111/#4112/#4113.
    # No new tests added — runner growth + existing suite depth. Raised to 35.
    # 2026-09-04: OOM at 8192 MB on two consecutive runs (heap hit ~8080 MB of
    # active data; 24 jsdom environments in parallel each hold 300–500 MB).
    # Raised to 12288 to match client-tests; parallelism capped at 2 forks in
    # vitest.desktop.config.ts to bound peak RSS across concurrent environments.
    # 2026-09-04: maxForks:2 serialises the suite but OOM still hits the ceiling
    # because one heavy test file alone exceeds it (same pattern as client-tests
    # which was fixed by raising 8192→12288). Reverted maxForks, raised to 14336.
    # ubuntu-latest is 16 GB; 14336 leaves ~1.7 GB for the OS and sibling processes.
    # 2026-09-05: full parallelism at 14336 MB takes >60 min wall-clock (suite
    # cancelled at the ceiling on two consecutive runs — 35 min and 60 min). Root
    # cause: 24 heavy jsdom forks competing for RAM on a 2-4 vCPU runner causes
    # GC contention that slows every file. Reverted to maxForks:2 in
    # vitest.desktop.config.ts to bound peak RSS; raised timeout to 90 min so
    # the semi-serialized suite completes (Run 2 at maxForks:2+12288 MB passed
    # 23/24 files in 57 min — 14336 MB covers the one file that OOM'd).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vitest run --config vitest.desktop.config.ts
        env:
          NODE_OPTIONS: --max-old-space-size=14336

  client-build:
    name: Client build
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - run: cd client && npx vite build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}

  # The proxy is a Cloudflare Worker (rmpg-api-proxy) with its own tsconfig.
  # wrangler deploy bundles it at deploy time, but nothing has ever typechecked
  # it in CI — a type error in proxy/index.ts would only surface at bundle time
  # during deploy, after the PR is already merged.
  proxy-typecheck:
    name: Proxy typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd proxy && npx tsc --noEmit

  client-entry-size:
    name: client-entry-size
    needs: [client-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci --legacy-peer-deps
      - name: Build with sourcemaps
        working-directory: client
        run: npx vite build --sourcemap
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
      # Ratchet on the ENTRY chunk only — it is what gates first paint.
      # Ceiling is the 2026-07-31 optimized size (433,810 B) plus ~7% headroom.
      # Raised 2026-08-21 from 458,000: CI with real VITE_MAPBOX_ACCESS_TOKEN
      # produces a 459,354 B artifact (~1.3 KB over prior ceiling) due to the
      # token being part of the build environment. No new eager imports added.
      # Raised 2026-09-04 from 466,000: merge commit on catch-any-cleanup PR
      # shuffled bundle module IDs by 1 B (466,001 vs 466,000). No new eager
      # imports; ceiling raised 1 KB to restore headroom.
      # If a change legitimately needs more, raise this deliberately in the
      # same PR and say why; do not silently bump it. `node scripts/measure-entry.mjs`
      # (no flag) prints the top 25 eager modules, which is usually enough to
      # see what got pulled in.
      - name: Assert entry chunk under ceiling
        working-directory: client
        run: node scripts/measure-entry.mjs --max-raw 467000
