name: "Security & Quality"

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"  # Weekly Monday 8:17am UTC
  workflow_dispatch:
  # Intentionally NOT on pull_request — this duplicated pr-tests.yml's
  # client-build job on every PR. npm audit + build canary now run
  # post-merge (push:main) and weekly instead; pr-tests.yml already gates
  # every PR on a real client build via vite.

# Least-privilege GITHUB_TOKEN (CWE-275). This job only runs `npm audit` and a
# client build canary — it reads the repo and uploads nothing back to GitHub.
permissions:
  contents: read

jobs:
  security-scan:
    name: Security Audit & Build Canary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          (cd client && npm ci --no-audit --no-fund)

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high || echo "::warning ::Root audit found vulnerabilities"
          (cd client && npm audit --audit-level=high) || echo "::warning ::Client audit found vulnerabilities"

      - name: Build client
        working-directory: client
        run: npx vite build
