name: toFixed Guard Check

on:
  pull_request:
    paths:
      - 'client/src/**'
      - 'scripts/check-tofixed-guards.js'
      - '.github/workflows/tofixed-guard-check.yml'
  push:
    branches: [main]
    paths:
      - 'client/src/**'
      - 'scripts/check-tofixed-guards.js'
      - '.github/workflows/tofixed-guard-check.yml'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN (CWE-275). Checkout + a single node guard script;
# read-only is all it needs.
permissions:
  contents: read

jobs:
  tofixed-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run toFixed false-guard check
        run: node scripts/check-tofixed-guards.js
