# Apply one D1 migration file to live `rmpg-flex` and mark it tracked.
#
# Why this exists (ORIGINAL, now FIXED): deploy.yml used to run
# `wrangler d1 migrations apply --remote` across every untracked file, which
# aborted at the first bare ALTER already present on live (0227
# starting_mileage), so later files never ran while the deploy still went
# green. deploy.yml no longer does that — it runs
# scripts/d1PendingMigrations.ts (statement-by-statement, duplicate-column
# tolerated, blocking) followed by scripts/check-migration-drift.sh, so the
# routine path is self-healing and needs no manual step.
#
# So this workflow is now the ESCAPE HATCH, not the normal path. Reach for it
# when the drift check goes red, during an emergency hotfix, or to repair a
# d1_migrations tracker row. It is safe to re-run: a duplicate-column /
# already-exists error is treated as an idempotent re-apply, and the final
# step prints the file's d1_migrations row so a no-op is obvious
# (changed_db: false). Prefer it over scripts/apply-migration.sh, which
# prompts on stdin and therefore hangs in non-interactive shells.
#
# Usage:
#   gh workflow run apply-d1-migration.yml -f filename=0270_tesseract_box_page_number.sql

name: Apply D1 migration

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'File under migrations/ (e.g. 0270_tesseract_box_page_number.sql)'
        required: true
        type: string
        default: 0270_tesseract_box_page_number.sql
  # pull_request trigger intentionally removed: this workflow writes directly to
  # live production D1 via wrangler d1 execute --remote, so it must only run on
  # explicit workflow_dispatch — never automatically on a PR open/update.

concurrency:
  group: apply-d1-${{ github.event.inputs.filename }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Apply file to live D1 and mark tracked
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FILENAME: ${{ github.event.inputs.filename }}
        run: |
          set -euo pipefail
          case "$FILENAME" in
            *.sql) ;;
            *) echo "::error::filename must end in .sql"; exit 65 ;;
          esac
          if ! [[ "$FILENAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::filename contains illegal characters"
            exit 65
          fi
          FILE="migrations/${FILENAME}"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE does not exist"
            exit 66
          fi
          echo "Applying $FILE to live D1 rmpg-flex..."
          set +e
          OUT=$(npx wrangler d1 execute rmpg-flex --remote --file "$FILE" 2>&1)
          EC=$?
          set -e
          echo "$OUT"
          if [ "$EC" -ne 0 ]; then
            if echo "$OUT" | grep -qiE 'duplicate column|already exists'; then
              echo "Idempotent re-apply — continuing to tracker insert"
            else
              echo "::error::wrangler d1 execute failed"
              exit "$EC"
            fi
          fi
          echo "Tracking $FILENAME in d1_migrations..."
          npx wrangler d1 execute rmpg-flex --remote \
            --command "INSERT OR IGNORE INTO d1_migrations (name, applied_at) VALUES ('${FILENAME}', datetime('now'))"
          echo "Verifying $FILENAME is tracked in d1_migrations..."
          npx wrangler d1 execute rmpg-flex --remote \
            --command "SELECT name, applied_at FROM d1_migrations WHERE name = '${FILENAME}'"
