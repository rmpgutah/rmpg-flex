# ============================================================
# Main Post-Merge Guardrail (typecheck + client tests)
# ============================================================
# Fast early-warning when a merge to main breaks typecheck or the client suite.
#
# The workflow's `name:` still reads "Main typecheck guardrail" deliberately —
# renaming it would orphan any branch-protection rule or dashboard that
# references that exact string. The file name and `name:` are historical; the
# job list below is the current scope.
#
# Why this exists separately from deploy.yml:
#   - deploy.yml ALSO runs typecheck, but only after `npm ci` plus
#     the D1 migrations step (~90s to surface a failure).
#   - This guardrail runs typecheck FIRST and FAST (~30s), so the
#     failure signal arrives before deploy machinery even starts.
#   - On failure, it OPENS A GITHUB ISSUE with the offending commit
#     SHA + a recommended revert command — turning a buried CI log
#     into a persistent, actionable record.
#
# Caught (retroactively, 2026-05-24):
#   - PR #605 auto-merge dropped an import the mount still referenced.
#     deploy.yml surfaced the failure at T+90s; no issue was opened,
#     so the outage lingered until manual investigation.
#   - PR #606 + PR #607 both independently added back the dropped
#     import within minutes — main ended up with the import declared
#     twice (TS2300 Duplicate identifier), same buried-log fate.
#
# Both would have been a one-click revert with this guardrail in place.
#
# ── Why a post-merge CLIENT TEST job lives here too (2026-07-26) ──
# pr-tests.yml deliberately does NOT run on push:main, reasoning that the PR
# already ran the same checks before merge. That is correct for SEQUENTIAL
# merges and unsound for CONCURRENT ones: CI evaluates refs/pull/N/merge, so a
# PR is only ever tested against the base as it stood at that moment. Two PRs
# that never saw each other's tree can each be green and still produce a red
# main.
#
# That is not theoretical. #3037 pinned a --rmpg-500/600 occurrence floor while
# #3038 added utils/withAlpha.ts, whose doc comments quote var(--rmpg-500) six
# times; the floor failed only once both had landed. In the same window #3038's
# concat ratchet went red on three `+ '20'` sites its migration had missed,
# because #3031 had already rewritten those exact lines. main sat red and NOTHING
# reported it — the typecheck jobs above pass, because both were assertion
# failures on valid, compiling code.
#
# It matters more than a buried log: deploy.yml runs typecheck and build but NO
# tests, so a red suite on main still SHIPS TO PRODUCTION. Typecheck breakage
# self-blocks the deploy; test breakage does not.
#
# Scoped to the CLIENT suite on purpose. Every cross-PR ratchet in this repo
# (accentTokens, hexAlphaConcatRatchet) asserts a repo-WIDE invariant and lives
# there, which is exactly the kind of test that fails on a combination rather
# than on either side alone. The worker suite is per-module unit tests, already
# run by .husky/pre-commit on every commit, and far less exposed to this class —
# so it is left out rather than spending main's CI minutes on it.
#
# SECURITY NOTE: this workflow is the kind of place where injection
# bugs hide. All user-controlled inputs (commit message, author name)
# are routed through `env:` vars in the failure step — never
# interpolated directly into shell or JS source. See
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

name: Main typecheck guardrail

on:
  push:
    branches: [main]

# Intentionally NO concurrency cancellation — every commit to main
# deserves its own clean typecheck result. Cancelling in-flight runs
# could hide a real regression behind a fast-following commit.

permissions:
  contents: read
  issues: write

jobs:
  worker-typecheck:
    name: Worker typecheck (post-merge)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Worker typecheck (tsc --noEmit)
        id: typecheck
        run: npm run typecheck

      - name: Open issue on failure
        if: failure() && steps.typecheck.conclusion == 'failure'
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const sha = process.env.COMMIT_SHA;
            const short = sha.slice(0, 7);
            const author = process.env.COMMIT_AUTHOR || 'unknown';
            const title = (process.env.COMMIT_MESSAGE || '').split('\n')[0].slice(0, 120);
            const runUrl = process.env.RUN_URL;

            const body = [
              '**Commit:** `' + sha + '`',
              '**Title:** ' + title,
              '**Author:** ' + author,
              '**CI run:** ' + runUrl,
              '',
              '## What happened',
              'Worker `tsc --noEmit` failed on `main` after this commit merged. The Worker code is now in a state where `wrangler deploy` will also fail — production has NOT been replaced (deploy.yml`s typecheck step aborts too), but the next merge to main will keep failing until this is resolved.',
              '',
              '## Recommended remediation',
              '',
              'If the offending commit is the most recent one (`' + short + '`):',
              '```bash',
              'git revert --no-edit ' + sha,
              'git push origin main',
              '```',
              '',
              'If a fix-forward is faster (e.g. a one-line dedupe or missing import), open a hotfix PR and reference this issue.',
              '',
              '## Auto-close',
              'This issue will NOT auto-close. Close it manually once `main` typechecks cleanly again, so the audit trail stays intact.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Worker typecheck broke at ' + short,
              body,
              labels: ['ci-broken', 'urgent'],
            });

  client-typecheck:
    name: Client typecheck (post-merge)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        run: cd client && npm ci --legacy-peer-deps

      - name: Client typecheck (tsc --noEmit)
        id: client-typecheck
        run: cd client && npx tsc --noEmit

      - name: Open issue on failure
        if: failure() && steps.client-typecheck.conclusion == 'failure'
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const sha = process.env.COMMIT_SHA;
            const short = sha.slice(0, 7);
            const author = process.env.COMMIT_AUTHOR || 'unknown';
            const title = (process.env.COMMIT_MESSAGE || '').split('\n')[0].slice(0, 120);
            const runUrl = process.env.RUN_URL;

            const body = [
              '**Commit:** `' + sha + '`',
              '**Title:** ' + title,
              '**Author:** ' + author,
              '**CI run:** ' + runUrl,
              '',
              '## What happened',
              'Client `tsc --noEmit` failed on `main` after this commit merged. The client SPA will not build — next `deploy.yml` will fail at the client build step. The API is unaffected.',
              '',
              '## Recommended remediation',
              '',
              'If the offending commit is the most recent one (`' + short + '`):',
              '```bash',
              'git revert --no-edit ' + sha,
              'git push origin main',
              '```',
              '',
              'If a fix-forward is faster, open a hotfix PR and reference this issue.',
              '',
              '## Auto-close',
              'This issue will NOT auto-close. Close it manually once `main` typechecks cleanly again, so the audit trail stays intact.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Client typecheck broke at ' + short,
              body,
              labels: ['ci-broken', 'urgent'],
            });

  # Post-merge client tests run the same suite as pr-tests.yml's sharded jobs,
  # but in a single job — acceptable because this is a detection step, not the
  # primary gate. PDF/maps/desktop configs are run separately so their large
  # parsed ASTs (mapbox-gl ~10 MB, jsPDF ~10 MB each) don't OOM the runner.
  # NODE_OPTIONS caps the heap at the same ceiling as the sharded pre-merge jobs.
  client-tests:
    name: Client tests (post-merge)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        run: cd client && npm ci --legacy-peer-deps

      - name: Client tests — main suite
        id: client-tests
        run: cd client && npx vitest run
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Client tests — PDF suite
        run: cd client && npx vitest run --config vitest.pdf.config.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Client tests — map suite
        run: cd client && npx vitest run --config vitest.maps.config.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Client tests — desktop components
        run: cd client && npx vitest run --config vitest.desktop.config.ts
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Open issue on failure
        if: failure() && steps.client-tests.conclusion == 'failure'
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const sha = process.env.COMMIT_SHA;
            const short = sha.slice(0, 7);
            const author = process.env.COMMIT_AUTHOR || 'unknown';
            const title = (process.env.COMMIT_MESSAGE || '').split('\n')[0].slice(0, 120);
            const runUrl = process.env.RUN_URL;

            const body = [
              '**Commit:** `' + sha + '`',
              '**Title:** ' + title,
              '**Author:** ' + author,
              '**CI run:** ' + runUrl,
              '',
              '## What happened',
              'The client vitest suite failed on `main` after this commit merged.',
              '',
              '**This does NOT block the deploy.** `deploy.yml` runs typecheck and the client build, but no tests — so `main` will ship to production with a failing suite. Treat this as production-affecting until triaged, unlike a typecheck break, which aborts the deploy on its own.',
              '',
              '## Most likely cause: two PRs that never saw each other',
              'A green PR does not guarantee a green `main`. CI evaluates `refs/pull/N/merge`, so each PR was only ever tested against the base as it stood at that moment. Two PRs merging close together can each pass and still combine into a red `main` — this guardrail exists because that happened with #3037 + #3038.',
              '',
              'Check that first:',
              '```bash',
              'git log --oneline -8 main',
              '```',
              'If two recent commits touch the same area — especially a repo-wide ratchet or allowlist test — the failure is likely the COMBINATION, not either commit alone. Reverting one may not be the right fix.',
              '',
              '## Recommended remediation',
              '',
              'Reproduce locally against the same tree first:',
              '```bash',
              'git fetch origin main && git checkout main && git pull',
              'cd client && npm ci --legacy-peer-deps && npx vitest run',
              '```',
              '',
              'If a ratchet/allowlist test is the failure and the new entry is legitimate, pin it WITH a reason rather than loosening the assertion. If the offending commit is the most recent one (`' + short + '`) and stands alone:',
              '```bash',
              'git revert --no-edit ' + sha,
              'git push origin main',
              '```',
              '',
              '## Auto-close',
              'This issue will NOT auto-close. Close it manually once `main` is green again, so the audit trail stays intact.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Client tests broke at ' + short,
              body,
              labels: ['ci-broken', 'urgent'],
            });
