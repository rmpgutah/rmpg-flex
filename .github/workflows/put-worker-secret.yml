# Copy one Worker secret from a GitHub Actions secret into live `rmpg-flex-api`.
#
# ⚠️ This workflow writes to LIVE PRODUCTION. It exists because the Cloudflare
# credentials live here, not on contributor machines — the same reason
# apply-d1-migration.yml exists. Read the three design constraints below before
# changing anything: each one is load-bearing, not ceremony.
#
# ── 1. The VALUE IS NEVER A WORKFLOW INPUT ───────────────────────────────────
# The obvious shape for this workflow — `workflow_dispatch` with a `value`
# input — leaks the secret. Dispatch inputs are stored in the run's metadata
# and rendered in the Actions UI to everyone with READ access to the repo, are
# not masked in logs, and persist in the run history after the secret is
# rotated. So the value is NOT an input. It is read from a GitHub Actions
# secret named  WORKER_SECRET_<NAME>  and only the NAME is dispatched.
#
#   To set SAFEWATCH_WEBHOOK_SECRET:
#     1. gh secret set WORKER_SECRET_SAFEWATCH_WEBHOOK_SECRET   # prompts, not echoed
#     2. gh workflow run put-worker-secret.yml -f secret_name=SAFEWATCH_WEBHOOK_SECRET
#     3. approve the run in the `production-secrets` environment
#
# Generate the value with `openssl rand -base64 32` and pipe it straight into
# step 1 — never paste a secret into a chat, an issue, or a PR body. A secret
# that has appeared in conversation text must be rotated before use (see the
# Legal Data Hunter note in CLAUDE.md for the precedent).
#
# ── 2. THE NAME IS AN ALLOWLIST, NOT FREE TEXT ───────────────────────────────
# `type: choice` renders a dropdown and rejects anything off the list, so this
# workflow CANNOT be used to overwrite an arbitrary binding. Three classes of
# secret are deliberately EXCLUDED, because setting them here would be
# destructive in a way no approval step makes safe:
#
#   JWT_SECRET / JWT_SECRET_PREVIOUS — overwriting invalidates every live
#     session instantly, mid-shift, for every dispatcher and officer. Rotating
#     auth is a planned maintenance action, not a dropdown.
#   EMAIL_FIELD_ENCRYPTION_KEK, FILE_ENCRYPTION_KEK(_PREVIOUS), CPG_ENC_KEY,
#     TRACCAR_ENC_KEY, PDF_SIGNING_KEY — these encrypt or sign data AT REST.
#     Replacing one does not re-encrypt what is already stored; it makes that
#     data permanently unreadable or unverifiable. There is no undo.
#
# Everything on the list below is an outbound integration credential whose
# worst case is "that integration is broken until the peer is updated".
# Adding a name to this list is a security decision — justify it in the PR.
#
# ── 3. EVERY RUN NEEDS A HUMAN ───────────────────────────────────────────────
# The `production-secrets` environment must be configured in repo Settings →
# Environments with REQUIRED REVIEWERS. Without that, this file is just
# "anyone with write access can rewrite production credentials". The
# environment reference below does nothing on its own — the protection rule is
# what enforces it, and it has to be set in the UI.
#
# Usage:
#   gh workflow run put-worker-secret.yml -f secret_name=SAFEWATCH_WEBHOOK_SECRET

name: Put Worker secret

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Worker secret to set (value comes from WORKER_SECRET_<NAME>)'
        required: true
        type: choice
        options:
          - SAFEWATCH_WEBHOOK_SECRET
          - ROBOFLOW_API_KEY
          - CARXE_API_KEY
          - LEGAL_DATA_HUNTER_API_KEY
          - IPED_API_KEY
          - FLEETIO_API_KEY
          - FLEETIO_ACCOUNT_TOKEN
          - FLEETIO_WEBHOOK_SECRET
          - DIAL_CONNECT_SERVICE_KEY
          - DIAL_CONNECT_WEBHOOK_SECRET
          - RMPG_FLEX_WEBHOOK_SECRET
  # No push / pull_request trigger, by design: this writes live production
  # credentials and must only ever run on an explicit, approved dispatch.

concurrency:
  group: put-worker-secret-${{ github.event.inputs.secret_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  put:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gate: configure required reviewers on this environment or the approval
    # step above is not actually enforced.
    environment: production-secrets
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Set the secret on rmpg-flex-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_NAME: ${{ github.event.inputs.secret_name }}
          # Dynamic lookup: the value never passes through an input, a file, or
          # a command line — only this env var, which Actions masks.
          SECRET_VALUE: ${{ secrets[format('WORKER_SECRET_{0}', github.event.inputs.secret_name)] }}
        run: |
          set -euo pipefail

          # `type: choice` already constrains this, but a re-dispatch of an old
          # run can carry a name since removed from the list.
          if ! [[ "$SECRET_NAME" =~ ^[A-Z][A-Z0-9_]*$ ]]; then
            echo "::error::secret_name must be UPPER_SNAKE_CASE"
            exit 65
          fi

          # An absent WORKER_SECRET_* resolves to the empty string rather than
          # failing. Writing that would be worse than doing nothing: the route
          # would read a set-but-empty binding instead of reporting
          # not_configured, so the endpoint looks live while rejecting
          # everything. Fail loudly instead.
          if [ -z "${SECRET_VALUE:-}" ]; then
            echo "::error::Repository secret WORKER_SECRET_${SECRET_NAME} is unset or empty."
            echo "::error::Set it first:  gh secret set WORKER_SECRET_${SECRET_NAME}"
            exit 65
          fi

          # Belt and braces — Actions masks `secrets.*` already, but this also
          # covers the value if a future edit derives from it.
          echo "::add-mask::$SECRET_VALUE"

          echo "Setting ${SECRET_NAME} on Worker rmpg-flex-api..."
          # printf, not echo: no trailing newline, and the value reaches
          # wrangler over stdin rather than argv (argv is world-readable in
          # /proc on the runner).
          printf '%s' "$SECRET_VALUE" | npx wrangler secret put "$SECRET_NAME"

      - name: Verify it is registered (names only, never values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_NAME: ${{ github.event.inputs.secret_name }}
        run: |
          set -euo pipefail
          # `wrangler secret list` returns names and types only — Cloudflare
          # never discloses a secret's value back, so this cannot leak.
          npx wrangler secret list | tee /tmp/secrets.json
          if ! grep -q "\"$SECRET_NAME\"" /tmp/secrets.json; then
            echo "::error::${SECRET_NAME} is not listed on rmpg-flex-api after the put"
            exit 1
          fi
          echo "✓ ${SECRET_NAME} is set on rmpg-flex-api"
          echo "Set by @${GITHUB_ACTOR} — value not logged." >> "$GITHUB_STEP_SUMMARY"
          echo "Secret: \`${SECRET_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
