name: D1 backup

# Full-database export takes an exclusive lock on live D1. Do NOT run this on
# the deploy job — officers cannot log in while `wrangler d1 export` is running.
# Schedule is 10:00 UTC (04:00 America/Denver during MDT).

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

concurrency:
  group: rmpg-flex-d1-export
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Export D1 and upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BACKUP_DATE=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          BACKUP_FILE="rmpg-flex-backup-${BACKUP_DATE}.sql"

          # wrangler d1 export rejects databases containing virtual tables (fts5).
          # If wrangler d1 export fails, fall back to exporting table schemas & data.
          if ! npx wrangler d1 export rmpg-flex --remote --output "${BACKUP_FILE}"; then
            echo "::warning::wrangler d1 export failed (e.g. FTS5 virtual tables). Generating table-level dump..."
            TABLES=$(npx wrangler d1 execute rmpg-flex --remote \
              --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '%_fts%' AND name NOT LIKE '%_idx%' AND name NOT LIKE '%_docsize%' AND name NOT LIKE '%_config%' AND name NOT LIKE '%_content%' AND name NOT LIKE '%_data%'" \
              | grep -o '\[.*\]' \
              | python3 -c "import json, sys; data=json.load(sys.stdin); print(' '.join(r['name'] for r in data[0]['results']))" 2>/dev/null || echo "")

            echo "-- RMPG Flex Backup (Fallback Dump) ${BACKUP_DATE}" > "${BACKUP_FILE}"
            for tbl in $TABLES; do
              echo "-- Table: $tbl" >> "${BACKUP_FILE}"
              npx wrangler d1 execute rmpg-flex --remote --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='$tbl'" >> "${BACKUP_FILE}" 2>/dev/null || true
            done
          fi

          if [ -s "${BACKUP_FILE}" ]; then
            npx wrangler r2 object put "d1-backups/${BACKUP_FILE}" --file="${BACKUP_FILE}" --remote
            echo "D1 backup completed: ${BACKUP_FILE}"
          else
            echo "::error::Backup file is empty"
            exit 1
          fi
          rm -f "${BACKUP_FILE}"
