name: "CodeQL"

# Advanced CodeQL setup (replaces the repo's default setup) so we can exclude the
# quarantined legacy/ tree via .github/codeql/codeql-config.yml. Scans the LIVE
# stack: the Cloudflare Worker + React client (javascript-typescript), the PDF
# sidecar (python), and the workflows themselves (actions).
#
# ⚠️ Advanced and default setup are mutually exclusive — GitHub blocks this
# workflow while default setup is enabled. After this lands on main, default
# setup must be turned OFF (Settings → Code security → CodeQL → disable default
# setup, or PATCH .../code-scanning/default-setup state=not-configured) for these
# runs to execute. See memory project-codeql-default-setup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1" # weekly, Monday 08:17 UTC
  workflow_dispatch:

# Least-privilege default; the analyze job opts into security-events: write.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload SARIF results
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
