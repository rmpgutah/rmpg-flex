name: Desktop Release

# Builds the Windows Electron installer and publishes it to the auto-update
# feed. Triggered by pushing a version tag (e.g. `git tag v5.8.5 && git push
# origin v5.8.5`) or manually via the Actions tab.
#
# Why a Windows runner: the desktop app bundles native C++ modules
# (serialport — the Toughbook internal-GPS NMEA reader — and better-sqlite3).
# They must be compiled for win32-x64 against Electron's Node ABI, which can
# only happen on Windows. A macOS/Linux build ships wrong-arch bindings that
# crash require('serialport') on the Toughbook and silently disable internal
# GPS. windows-latest has the VS C++ Build Tools + Python that electron-rebuild
# needs.
#
# Where it publishes: the rmpg-flex-api Worker serves the electron-updater feed
# from the `rmpg-flex-downloads` R2 bucket at https://api.rmpgutah.us/updates/
# (see src/routes/downloads.ts + desktop/updater.js). We upload the installer,
# its blockmap, and the electron-builder-generated latest*.yml (UNEDITED — its
# sha512 must match the installer byte-for-byte) straight into that bucket.
#
# macOS build (build-macos, below): requires an Apple Developer ID Application
# certificate — electron-updater refuses to apply unsigned updates on macOS
# (Gatekeeper), so until these secrets exist the job fails loudly rather than
# silently publishing an unsigned/unnotarized build clients can't install:
#   APPLE_CERTIFICATE              base64 of the .p12 export of the
#                                   "Developer ID Application" cert
#                                   (base64 -i cert.p12 | pbcopy)
#   APPLE_CERTIFICATE_PASSWORD     password the .p12 was exported with
#   APPLE_ID                       Apple ID email enrolled in the
#                                   Apple Developer Program
#   APPLE_APP_SPECIFIC_PASSWORD    app-specific password for that Apple ID
#                                   (appleid.apple.com → Sign-In and Security)
#   APPLE_TEAM_ID                  10-char Team ID (developer.apple.com/account)
# electron-builder auto-signs from CSC_LINK/CSC_KEY_PASSWORD and
# auto-notarizes from APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID —
# no extra electron-builder config needed beyond desktop/package.json's
# mac.hardenedRuntime + entitlements (already set).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege GITHUB_TOKEN (CWE-275). The installer is published to an R2
# bucket via CLOUDFLARE_* secrets and `electron-builder --publish never`, so
# nothing is written back to GitHub (no releases/assets) — read-only suffices.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # Rebuild native modules explicitly so a compile failure fails the run
      # LOUDLY. The package.json postinstall runs the same electron-rebuild but
      # swallows errors (`|| echo ...`) for dev convenience — in CI that would
      # let a broken build ship wrong-ABI bindings and kill internal GPS.
      - name: Rebuild native modules for Electron
        working-directory: desktop
        run: npm run rebuild

      # --publish never: package.json has a GitHub publish provider, and
      # electron-builder auto-publishes on tag builds by default. The repo is
      # private, so that would fail; we host the feed on R2 instead.
      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      # Upload the installer, its blockmap, and latest.yml to the R2 bucket the
      # Worker serves the update feed from. ALL keys MUST use the `updates/`
      # prefix — the Worker's downloads.ts lists/fetches with prefix:'updates/'
      # and serves /updates/:filename as `updates/${filename}` in R2. Without
      # the prefix the installer lands at an unreachable key and electron-updater
      # clients never receive the update. Filenames are globbed (not interpolated)
      # so this is version-agnostic. latest.yml goes LAST so the .exe it
      # references is already fetchable when clients read the manifest.
      # wrangler reads CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID from env.
      - name: Publish to R2 update feed
        working-directory: desktop/dist
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $bucket = "rmpg-flex-downloads"
          $exe = Get-ChildItem -Filter *.exe | Where-Object { $_.Name -notlike '*.blockmap' } | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in desktop/dist" }
          if (-not (Test-Path "latest.yml")) { throw "latest.yml not generated by electron-builder" }
          Write-Host "Publishing $($exe.Name) to $bucket/updates/"
          npx --yes wrangler@4 r2 object put "$bucket/updates/$($exe.Name)" --file "$($exe.Name)" --remote
          if (Test-Path "$($exe.Name).blockmap") {
            npx --yes wrangler@4 r2 object put "$bucket/updates/$($exe.Name).blockmap" --file "$($exe.Name).blockmap" --remote
          } else {
            Write-Host "No blockmap found — skipping blockmap upload"
          }
          npx --yes wrangler@4 r2 object put "$bucket/updates/latest.yml" --file "latest.yml" --remote --content-type "text/yaml"
          # Publish the provisioning script so IT can always grab the latest from the feed
          npx --yes wrangler@4 r2 object put "$bucket/provision.ps1" --file "${{ github.workspace }}/desktop/scripts/provision.ps1" --remote --content-type "text/plain"

      - name: Verify feed
        shell: bash
        run: |
          echo "--- https://api.rmpgutah.us/updates/latest.yml ---"
          curl -sS https://api.rmpgutah.us/updates/latest.yml || true

  build-macos:
    runs-on: macos-latest
    # Notarization (via notarytool, invoked internally by electron-builder
    # once signing finishes) can legitimately run well past 30 minutes —
    # Apple's queue time is outside our control, and 30m killed a run that
    # was still notarizing normally (not stuck) mid-2026-07-21. 90m gives
    # real headroom without masking an actual hang forever.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Fail fast with a clear message instead of a cryptic electron-builder
      # signing error 20+ minutes into the job. All five must be set — see
      # the header comment above for what each one is and how to get it.
      - name: Verify Apple signing secrets are configured
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APP_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          HAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          missing=0
          for name in HAS_CERT HAS_CERT_PW HAS_APPLE_ID HAS_APP_PW HAS_TEAM_ID; do
            if [ "${!name}" != "true" ]; then
              echo "::error::Missing required secret for macOS signing (see desktop-release.yml header comment): $name"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Apple Developer ID secrets are not configured — see the macOS build comment at the top of this workflow for what to add under repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # Same rationale as the Windows job: fail loudly on a broken native
      # module build rather than shipping wrong-ABI serialport/better-sqlite3
      # bindings. macos-latest already has Xcode Command Line Tools, so no
      # extra toolchain setup is needed here (unlike Windows).
      - name: Rebuild native modules for Electron
        working-directory: desktop
        run: npm run rebuild

      # electron-builder auto-discovers the signing identity from CSC_LINK
      # (base64 .p12) + CSC_KEY_PASSWORD, and auto-notarizes afterward using
      # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID — no CLI flags or
      # extra config needed for either beyond package.json's mac.hardenedRuntime
      # + entitlements. --publish never: same reasoning as the Windows job,
      # we host the feed on R2, not GitHub Releases.
      - name: Build and notarize macOS installer
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --universal --publish never

      # Upload the .dmg, its blockmap, and latest-mac.yml to the same R2
      # bucket the Windows job uses. ALL keys MUST use the `updates/` prefix —
      # the Worker's downloads.ts fetches with prefix:'updates/' and serves
      # /updates/:filename as `updates/${filename}` in R2. latest-mac.yml goes
      # last so the .dmg it references is already fetchable when clients read it.
      - name: Publish to R2 update feed
        working-directory: desktop/dist
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bucket="rmpg-flex-downloads"
          dmg=$(find . -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "$dmg" ]; then echo "::error::No .dmg found in desktop/dist"; exit 1; fi
          if [ ! -f "latest-mac.yml" ]; then echo "::error::latest-mac.yml not generated by electron-builder"; exit 1; fi
          dmg_name=$(basename "$dmg")
          echo "Publishing $dmg_name to $bucket/updates/"
          npx --yes wrangler@4 r2 object put "$bucket/updates/$dmg_name" --file "$dmg_name" --remote
          if [ -f "$dmg_name.blockmap" ]; then
            npx --yes wrangler@4 r2 object put "$bucket/updates/$dmg_name.blockmap" --file "$dmg_name.blockmap" --remote
          fi
          npx --yes wrangler@4 r2 object put "$bucket/updates/latest-mac.yml" --file "latest-mac.yml" --remote --content-type "text/yaml"

      - name: Verify feed
        run: |
          echo "--- https://api.rmpgutah.us/updates/latest-mac.yml ---"
          curl -sS https://api.rmpgutah.us/updates/latest-mac.yml || true
