name: Desktop Release

# Builds the Windows Electron installer and publishes it to the auto-update
# feed. Triggered by pushing a version tag (e.g. `git tag v5.8.5 && git push
# origin v5.8.5`) or manually via the Actions tab.
#
# Why a Windows runner: the desktop app bundles native C++ modules
# (serialport — the Toughbook internal-GPS NMEA reader — and better-sqlite3).
# They must be compiled for win32-x64 against Electron's Node ABI, which can
# only happen on Windows. A macOS/Linux build ships wrong-arch bindings that
# crash require('serialport') on the Toughbook and silently disable internal
# GPS. windows-latest has the VS C++ Build Tools + Python that electron-rebuild
# needs.
#
# Where it publishes: the rmpg-flex-api Worker serves the electron-updater feed
# from the `rmpg-flex-downloads` R2 bucket at https://api.rmpgutah.us/updates/
# (see src/routes/downloads.ts + desktop/updater.js). We upload the .exe, its
# .blockmap, and the electron-builder-generated latest.yml (UNEDITED — its
# sha512 must match the .exe byte-for-byte) straight into that bucket.
#
# macOS is intentionally NOT built here: the mac app is unsigned
# (build.mac.identity = null), and electron-updater refuses to apply unsigned
# updates on macOS (Gatekeeper). Add a signed mac job only once an Apple
# Developer ID certificate is available.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege GITHUB_TOKEN (CWE-275). The installer is published to an R2
# bucket via CLOUDFLARE_* secrets and `electron-builder --publish never`, so
# nothing is written back to GitHub (no releases/assets) — read-only suffices.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # Rebuild native modules explicitly so a compile failure fails the run
      # LOUDLY. The package.json postinstall runs the same electron-rebuild but
      # swallows errors (`|| echo ...`) for dev convenience — in CI that would
      # let a broken build ship wrong-ABI bindings and kill internal GPS.
      - name: Rebuild native modules for Electron
        working-directory: desktop
        run: npm run rebuild

      # --publish never: package.json has a GitHub publish provider, and
      # electron-builder auto-publishes on tag builds by default. The repo is
      # private, so that would fail; we host the feed on R2 instead.
      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      # Upload the installer, its blockmap, and latest.yml to the R2 bucket the
      # Worker serves the update feed from. Filenames are globbed (not
      # interpolated) so this is version-agnostic. latest.yml goes LAST so the
      # .exe it references is already fetchable when clients read the manifest.
      # wrangler reads CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID from env.
      - name: Publish to R2 update feed
        working-directory: desktop/dist
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $bucket = "rmpg-flex-downloads"
          $exe = Get-ChildItem -Filter *.exe | Where-Object { $_.Name -notlike '*.blockmap' } | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in desktop/dist" }
          if (-not (Test-Path "latest.yml")) { throw "latest.yml not generated by electron-builder" }
          Write-Host "Publishing $($exe.Name) to $bucket"
          npx --yes wrangler@4 r2 object put "$bucket/$($exe.Name)" --file "$($exe.Name)" --remote
          npx --yes wrangler@4 r2 object put "$bucket/$($exe.Name).blockmap" --file "$($exe.Name).blockmap" --remote
          npx --yes wrangler@4 r2 object put "$bucket/latest.yml" --file "latest.yml" --remote --content-type "text/yaml"

      - name: Verify feed
        shell: bash
        run: |
          echo "--- https://api.rmpgutah.us/updates/latest.yml ---"
          curl -sS https://api.rmpgutah.us/updates/latest.yml || true
