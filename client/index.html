<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/rmpg flex.png" />
    <!--
      Pinch-zoom is deliberately ALLOWED. `maximum-scale=1.0, user-scalable=no`
      was set app-wide here, so every page on every device — not just the MDT,
      which is how it had been recorded — refused to zoom. That fails WCAG 1.4.4
      (Resize Text), and the app's own densest type sits at 9-11px on tables,
      which is exactly where an operator most needs to magnify.

      Removed at the operator's direction 2026-08-01. If a specific
      touch surface ever needs gesture suppression (e.g. to stop an accidental
      pinch while driving), scope it to that surface with CSS `touch-action`
      rather than reinstating a global zoom lock.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1722" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RMPG Flex" />
    <meta name="description" content="Rocky Mountain Protective Group — CAD/RMS Dispatch Console" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script>
      // Synchronously apply theme before React loads to prevent flash-of-wrong-theme (FOUC).
      // Resolution order: legacy flag → blue-silver (DEFAULT ON as of 2026-07-04's
      // app-wide blue/silver/white/red re-theme; set rmpg_theme_blue_silver='0' to
      // opt back out to the retired gold day/night scheme) → manual override →
      // time-of-day schedule (06:00–18:00 day).
      // Keep storage keys + valid values in sync with client/src/utils/theme.ts.
      (function () {
        try {
          var html = document.documentElement;
          var legacy = false;
          try { legacy = localStorage.getItem('rmpg_theme_legacy') === '1'; } catch (e) {}
          var blueSilver = false;
          if (!legacy) {
            try { blueSilver = localStorage.getItem('rmpg_theme_blue_silver') !== '0'; } catch (e) { blueSilver = true; }
          }

          var theme;
          if (legacy || blueSilver) {
            theme = 'dark';
          } else {
            var override = null;
            try { override = JSON.parse(localStorage.getItem('rmpg_theme_override') || 'null'); } catch (e) {}
            if (override && override.active) {
              theme = override.theme === 'light' ? 'light' : 'dark';
            } else {
              var h = new Date().getHours();
              theme = (h >= 6 && h < 18) ? 'light' : 'dark';
            }
          }

          // Must resolve IDENTICALLY to applyThemePreference() in src/utils/theme.ts, or
          // the pre-paint class and the runtime class disagree and the page
          // visibly swaps themes after hydration. Exactly one palette class.
          html.classList.remove('theme-dark', 'theme-light', 'theme-legacy-black', 'theme-blue-silver', 'dark');
          if (legacy) html.classList.add('theme-legacy-black');
          else if (blueSilver) html.classList.add('theme-blue-silver');
          else html.classList.add('theme-' + theme);
          if (theme === 'dark' || legacy || blueSilver) html.classList.add('dark');

          var lightSurface = theme === 'light' && !legacy && !blueSilver;
          var chrome = legacy ? '#000000' : blueSilver ? '#22405f' : (theme === 'light' ? '#d6d3c8' : '#0d1722');
          html.style.colorScheme = lightSurface ? 'light' : 'dark';
          html.style.backgroundColor = chrome;

          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', chrome);
          var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (statusBar) statusBar.setAttribute('content', lightSurface ? 'default' : 'black-translucent');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Reset default body margin BEFORE the bundled Tailwind preflight loads.
         Without this, the 8px default body margin lets <html>'s background
         (set to THEME_CHROME_COLORS in the boot script above — #000000 in
         dark mode) show through as a visible gutter around the pre-splash,
         since html chrome and body backgrounds are intentionally different
         colors (#000000 vs #0a0a0a in dark mode). */
      html, body { margin: 0; padding: 0; }

      /* Theme-aware pre-splash background — must be in <head> so it's parsed
         before the pre-splash <div> paints. The boot script above has already
         added theme-dark / theme-light classes to <html>, so the correct rule
         wins from first paint with no FOUC.
         Values MUST match THEME_BODY_BACKGROUNDS in client/src/utils/theme.ts
         so the splash fades into the hydrated body with no shade shift. */
      #pre-splash { background: #0d1722; }
      html.theme-light #pre-splash { background: #ece9dd; }
      html.theme-legacy-black #pre-splash { background: #0a0a0a; }
      html.theme-blue-silver #pre-splash { background: #22405f; }
    </style>
    <!--
      CSP Note: 'unsafe-inline' is required in script-src and style-src for:
      1. Vite dev mode injects inline scripts/styles for HMR
      2. Mapbox GL JS popup InfoWindow inline styles
      'unsafe-eval' is required by bundled vendor libs (charts/pdf/barcode + the
      Mapbox expression evaluator) that compile code at runtime via the Function
      constructor.

      MUST stay in sync with the canonical policy in client/public/_headers.
      A document governed by BOTH a header CSP and this <meta> CSP enforces the
      INTERSECTION (most-restrictive-wins per directive) — NOT "header overrides
      meta". A directive omitted here (e.g. a missing 'unsafe-eval' or media-src)
      independently blocks that capability even when _headers allows it. That
      exact drift previously blocked runtime code evaluation in production.
      'frame-ancestors', 'report-uri'/'report-to' are intentionally omitted:
      browsers ignore them when delivered via <meta>, so they live only in the
      _headers HTTP header.

      TODO (production hardening): Replace 'unsafe-inline' with nonce-based CSP
      by generating a per-request nonce on the server and injecting it into both
      the CSP header and all inline <script>/<style> tags. This requires server-side
      rendering of index.html (not static serving).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://api.mapbox.com https://js.arcgis.com https://*.arcgis.com https://esm.sh https://cdn.esm.sh https://unpkg.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://api.mapbox.com https://js.arcgis.com https://*.arcgis.com; img-src 'self' data: blob: https: http:; font-src 'self' data: https://*.gstatic.com https://js.arcgis.com https://*.arcgis.com; connect-src 'self' blob: ws: wss: https://api.rmpgutah.us https://*.rmpgutah.us https://www.cloudflare.com https://cloudflare.com https://api.mapbox.com https://events.mapbox.com https://*.arcgis.com https://js.arcgis.com https://*.arcgisonline.com https://api.open-meteo.com https://tile.openweathermap.org https://api.rainviewer.com https://tilecache.rainviewer.com https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://*.cartocdn.com https://nominatim.openstreetmap.org https://overpass-api.de https://api.fbi.gov https://photon.komoot.io https://graph.mapillary.com https://challenges.cloudflare.com https://esm.sh https://cdn.esm.sh https://storage.googleapis.com https://tfhub.dev https://www.kaggle.com https://unpkg.com https://huggingface.co https://*.huggingface.co https://5caa95c5789f4fc4ed3934b2a2c29ed4.r2.cloudflarestorage.com; frame-src 'self' blob: https://*.arcgis.com https://www.mapillary.com https://dialer.rmpgutah.us; media-src 'self' blob: data:; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <link rel="manifest" href="/manifest.json" />
    <title>RMPG Flex - Rocky Mountain Protective Group</title>
  </head>
  <body class="bg-surface-base text-white">
    <div id="root">
      <!-- Pre-React branded splash — hidden once React hydrates -->
      <div id="pre-splash" style="display:flex;align-items:center;justify-content:center;height:100dvh;height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)">
        <div style="display:flex;flex-direction:column;align-items:center">
          <img src="/rmpg flex.png" alt="RMPG Flex" width="88" height="88"
               style="filter:drop-shadow(0 0 20px rgba(136,136,136,0.3));object-fit:contain" draggable="false" />
          <div style="margin-top:16px;margin-bottom:12px;width:140px;height:2px;background:#1a1a1a;border-radius:1px;overflow:hidden">
            <div style="width:48px;height:100%;background:linear-gradient(90deg,transparent,#888888,transparent);animation:sl 1.6s ease-in-out infinite"></div>
          </div>
          <p style="font-size:9px;text-transform:uppercase;letter-spacing:0.2em;font-weight:700;color:rgba(160,160,160,0.7);font-family:Arial,Helvetica,sans-serif;margin:0">
            Initializing
          </p>
        </div>
      </div>
      <style>#pre-splash{transition:opacity .3s}@keyframes sl{0%{transform:translateX(-48px)}100%{transform:translateX(140px)}}</style>
    </div>
    <script id="rmpg-entry" type="module" src="/src/main.tsx"></script>
    <script>
      // Entry-graph stale-chunk safety net — covers what chunkRetry.ts (in
      // utils/chunkRetry.ts, wired up inside main.tsx) CANNOT: a failure in
      // one of main.tsx's own STATIC imports (e.g. AuthContext, split into
      // its own chunk by the bundler). During back-to-back Cloudflare Pages
      // deploys, the CDN can serve an index.html whose entry module still
      // points at an asset hash a newer deploy already rotated out; the
      // failed chunk request gets Pages' SPA-fallback HTML instead of JS,
      // which fails module parsing.
      //
      // That failure happens WHILE the entry module graph is still resolving
      // — before a single line of main.tsx's own body has run — so the
      // `unhandledrejection` listener chunkRetry.ts installs never gets
      // wired up, and the "Initializing" splash is stranded forever with no
      // error and no recovery path (confirmed live 2026-07-13, mid a rapid
      // deploy sequence: assets/AuthContext-*.js 404'd as "Stale chunk (HTML
      // fallback)" and the app never mounted, no console error visible).
      //
      // Per spec, a module <script>'s `error` event fires for a failure
      // ANYWHERE in its static import tree, not just the top-level file —
      // so listening here catches this class of failure uniformly. Mirrors
      // chunkRetry.ts's bounded one-reload-per-30s guard, using the SAME
      // sessionStorage key so the two paths can't loop against each other.
      //
      // A BARE reload() here is not enough, and shipping one made this bug
      // unrecoverable rather than self-healing (live incident 2026-07-30).
      // The service worker is what served the broken entry module: sw.js's
      // hashed-asset poison guard answers a stale chunk with an EMPTY
      // `new Response('', {status: 404})`, and its offline path with an empty
      // 503. Reloading re-enters the same SW, which serves the same empty
      // body — so the reload changes nothing, the once-per-30s budget is
      // spent on it, and the splash is then stranded permanently with no
      // console error. Measured signature: the entry bundle shows
      // decodedBodySize 0 in performance.getEntriesByType('resource') while
      // an older hash shows its real size (that older one is the SW cache,
      // which is why already-open tabs keep working and only hard
      // navigations break).
      //
      // So: purge the SW registration and its caches FIRST, then reload — a
      // reload that can actually reach the network. Cookies and localStorage
      // are untouched, so the user stays signed in (auth here is localStorage,
      // not cookies). The purge is bounded by a timer so a hung caches/SW API
      // can never prevent the reload it is meant to enable.
      (function () {
        var el = document.getElementById('rmpg-entry');
        // ⚠️ DO NOT reduce this to getElementById('rmpg-entry') alone.
        //
        // Vite REWRITES the entry script tag at build time and does not carry
        // the `id` across. Source ships the tag with id="rmpg-entry" pointing at
        // /src/main.tsx; the build emits an otherwise-equivalent tag carrying
        // type="module" + crossorigin + src="/assets/index-<hash>.js" and NO id.
        // (Written prose rather than literal tags on purpose: the stampCfAsync
        // vite plugin rewrites anything matching a script tag, comments
        // included, and literal examples here would also pollute greps.)
        //
        // So in every production build getElementById returned null, this
        // function returned early, and THE ENTIRE SAFETY NET WAS NEVER
        // INSTALLED — silently, since a missing listener throws nothing. That
        // is why the INITIALIZING wedge kept requiring a manual hard-refresh
        // even though this recovery has existed since the 2026-07-13 incident.
        // Confirmed live 2026-07-31 by evaluating document.getElementById(
        // 'rmpg-entry') on a wedged production tab: null.
        //
        // Grepping dist/ for the handler's own source is NOT sufficient
        // verification — the code shipped, but the element it depends on did
        // not. Assert on the built <script> tag instead (see
        // entryRecovery.test.ts).
        if (!el) el = document.querySelector('script[type="module"][src*="/assets/"]');
        if (!el) el = document.querySelector('script[type="module"][src]');

        function purgeThenReload() {
          var reloaded = false;
          function go() {
            if (reloaded) return;
            reloaded = true;
            window.location.reload();
          }
          // Hard ceiling: never let a stuck purge block recovery.
          setTimeout(go, 3000);

          var tasks = [];
          try {
            if (window.caches && caches.keys) {
              tasks.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }));
            }
          } catch (e) { /* Cache API unavailable — fall through to reload */ }
          try {
            var sw = navigator.serviceWorker;
            if (sw && sw.getRegistrations) {
              tasks.push(sw.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }));
            }
          } catch (e) { /* SW API unavailable — fall through to reload */ }

          // Evict the entry chunk from the browser's own HTTP cache.
          //
          // Confirmed live 2026-07-31: during a Pages deploy's propagation
          // window the CDN can answer a not-yet-published chunk with the SPA
          // fallback — index.html, HTTP 200, Content-Type text/html. Those
          // assets carry immutable cache headers, so that poisoned HTML is
          // stored in the browser's HTTP disk cache and every later load
          // re-reads it. Module parsing fails and the page strands here.
          //
          // Nothing above can fix that: caches.delete() clears the SERVICE
          // WORKER cache and unregister() drops the SW, but neither touches the
          // HTTP cache, and JS cannot evict it directly. A plain reload re-reads
          // the same poisoned entry. That is why the documented remedy was a
          // manual hard-refresh (Cmd/Ctrl+Shift+R).
          //
          // `fetch(src, {cache:'reload'})` is the one lever JS does have: it
          // bypasses the HTTP cache AND writes the fresh response back into it,
          // so the reload below reads good JS. Best-effort — a failure here must
          // never block recovery, and it is covered by the same 3s ceiling.
          //
          // Diagnostic that isolates this cause from the others: fetch the entry
          // URL twice, once plain and once with {cache:'reload'}, and compare
          // content-type. Same URL, two answers => poisoned HTTP cache. (curl
          // has no browser cache, so "curl works but the browser doesn't" is the
          // signature, and it reads misleadingly like a server problem.)
          try {
            var entrySrc = el.getAttribute('src');
            if (entrySrc && window.fetch) {
              tasks.push(fetch(entrySrc, { cache: 'reload' }).catch(function () {}));
            }
          } catch (e) { /* fetch unavailable — fall through to reload */ }

          if (!tasks.length) return go();
          Promise.all(tasks).then(go, go);
        }

        // Shared once-per-30s gate. Returns true if recovery may run now.
        // sessionStorage unavailable (private mode / blocked storage) => the
        // guard cannot be enforced, so we decline rather than risk a loop.
        function mayRecover() {
          try {
            var KEY = 'rmpg_chunk_reload';
            var WINDOW_MS = 30000;
            var raw = sessionStorage.getItem(KEY);
            var lastAt = raw ? parseInt(raw, 10) : null;
            if (lastAt !== null && isNaN(lastAt)) lastAt = null;
            if (lastAt === null || Date.now() - lastAt > WINDOW_MS) {
              sessionStorage.setItem(KEY, String(Date.now()));
              return true;
            }
            return false;
          } catch (e) {
            return false;
          }
        }

        if (el) {
          el.addEventListener('error', function () {
            if (mayRecover()) purgeThenReload();
          });
        }

        // Boot watchdog — the backstop that does not depend on ANY error event.
        //
        // The listener above only helps when the browser actually fires `error`
        // on the entry script. Two of the three known causes of a stranded
        // INITIALIZING splash do not:
        //
        //   1. Rocket Loader rewrites type="module" -> type="<hash>-module".
        //      The bundle is fetched with a clean 200 and simply NEVER
        //      EXECUTES. There is no error, by construction, so no listener
        //      can fire. (Zone-level fix is #3186's data-cfasync stamping;
        //      this is the client-side net if that ever regresses.)
        //   2. A static import of the entry graph resolving to a 0-byte body
        //      (observed live 2026-07-31: AuthContext-<hash>.js, decodedBodySize
        //      0, React never mounted, no console error).
        //
        // So: if React has not replaced #pre-splash within the timeout, treat
        // the boot as failed and run the same purge+refetch recovery. Uses the
        // SAME once-per-30s gate, so a genuinely slow boot recovers once and a
        // persistently broken origin cannot loop.
        //
        // 15s is deliberately well past a cold boot on a slow connection —
        // this must never fire on a page that was merely going to be late.
        var BOOT_TIMEOUT_MS = 15000;
        setTimeout(function () {
          try {
            var splash = document.getElementById('pre-splash');
            // Splash gone => React mounted and cleaned up. Nothing to do.
            if (!splash) return;
            var root = document.getElementById('root');
            var mounted = root && root.children.length > 0 && !root.contains(splash);
            if (mounted) return;
            if (mayRecover()) purgeThenReload();
          } catch (e) { /* never let the watchdog itself throw */ }
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
    <!-- Service worker registration handled by useServiceWorker hook in React -->
  </body>
</html>
