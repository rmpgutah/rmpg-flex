version: '3.8'

services:
  # Email service — runs Wrangler dev locally with D1
  email-api:
    image: node:20-alpine
    container_name: email-worker
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm exec wrangler dev --local --host 0.0.0.0 --port 8787"
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: development
      WRANGLER_ENV: local
    volumes:
      - .:/app
      - /app/node_modules  # Prevent bind mount from overwriting
    networks:
      - email-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # SQLite database for D1
  database:
    image: keinos/sqlite3:latest
    container_name: email-db
    volumes:
      - db-volume:/data
    ports:
      - "5432:5432"
    networks:
      - email-network
    restart: unless-stopped

  # Nginx reverse proxy for HTTPS + CORS
  proxy:
    image: nginx:alpine
    container_name: email-proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - email-network
    depends_on:
      - email-api
    restart: unless-stopped

volumes:
  db-volume:

networks:
  email-network:
    driver: bridge
