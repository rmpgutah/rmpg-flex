version: '3.8'

services:
  # Cloudflare Workers local environment with D1
  email-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email-worker
    ports:
      - "8787:8787"
    environment:
      # D1 database connection
      - DATABASE_URL=sqlite:///app/.wrangler/state/d1.db
      - NODE_ENV=development
      - WRANGLER_ENV=development
      # For local HTTPS proxying (disable for local dev)
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
    volumes:
      # Persist D1 database
      - worker-state:/app/.wrangler/state
      # Hot reload source
      - ./src:/app/src
      - ./wrangler.toml:/app/wrangler.toml
    networks:
      - email-network
    restart: unless-stopped
    depends_on:
      - email-db

  # D1 SQLite database (persistent)
  email-db:
    image: nfqsolutions/sqlite:latest
    container_name: email-db
    volumes:
      - db-data:/data
    ports:
      - "5432:5432"  # Expose if needed for debugging
    networks:
      - email-network
    environment:
      - SQLITE_DB=/data/rmpg.db
    restart: unless-stopped

  # Reverse proxy for local HTTPS (optional, for testing image-proxy with tokens)
  email-proxy:
    image: nginx:alpine
    container_name: email-proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - email-network
    depends_on:
      - email-worker
    restart: unless-stopped

volumes:
  worker-state:
    driver: local
  db-data:
    driver: local

networks:
  email-network:
    driver: bridge
