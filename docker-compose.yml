version: '3.8'

services:
  email-worker:
    image: node:22-alpine
    container_name: email-worker
    working_dir: /app
    command: >
      sh -c "
        npm install -g pnpm &&
        pnpm config set --global verify-store-integrity false &&
        pnpm install --no-frozen-lockfile --ignore-scripts 2>/dev/null || pnpm install --ignore-scripts 2>/dev/null || true &&
        pnpm exec wrangler dev --local --host 0.0.0.0 --port 8787
      "
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - email-net
    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    container_name: email-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - email-net
    depends_on:
      - email-worker
    restart: unless-stopped

networks:
  email-net:
    driver: bridge
