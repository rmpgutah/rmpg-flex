<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMPG Flex Connect — iOS Install</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px 24px;
        }
        .shield {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #d4a017;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .shield span { font-size: 40px; }
        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .connect {
            font-size: 14px;
            color: #d4a017;
            letter-spacing: 6px;
            margin-bottom: 24px;
            text-transform: uppercase;
        }
        .install-btn {
            display: inline-block;
            background: #d4a017;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 48px;
            border-radius: 8px;
            text-decoration: none;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }
        .install-btn:hover { opacity: 0.9; }
        .version {
            font-size: 11px;
            color: #666;
            margin-top: 24px;
        }
        .note {
            font-size: 11px;
            color: #888;
            margin-top: 12px;
            line-height: 1.5;
        }
        .ipad-only {
            display: none;
            color: #ef4444;
            font-size: 12px;
            margin-top: 16px;
            padding: 10px;
            background: rgba(239,68,68,0.1);
            border-radius: 6px;
        }
        @media only screen and (min-device-width: 768px) {
            .ipad-only { display: block; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="shield"><span>&#128737;</span></div>
        <h1>RMPG Flex</h1>
        <div class="connect">Connect</div>

        <a class="install-btn"
           href="itms-services://?action=download-manifest&amp;url=https://rmpgutah.us/ios/ota/manifest.plist">
            INSTALL
        </a>

        <div class="version">Version 1.0.0 — Build 1</div>
        <div class="ipad-only">
            iPads: open this page in <strong>Safari</strong> to install.
            Other browsers do not support OTA installation.
        </div>
        <div class="note">
            This app requires iOS 17.0+.<br>
            Installation is restricted to authorized devices.<br>
            Contact your RMPG administrator for access.
        </div>
    </div>

    <script>
    if (navigator.userAgent.match(/iPhone|iPad|iPod/)) {
        if (!navigator.userAgent.match(/Safari/) || navigator.userAgent.match(/CriOS|FxiOS|OPiOS|mercury/)) {
            document.querySelector('.ipad-only').textContent =
                'Open this page in Safari, then tap Install.';
            document.querySelector('.ipad-only').style.display = 'block';
        }
    }
    </script>
</body>
</html>
