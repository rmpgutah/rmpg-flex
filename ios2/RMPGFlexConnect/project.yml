name: RMPGFlexConnect
options:
  bundleIdPrefix: com.rmpg.flex
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  CoreAPI:
    path: .
  CoreAuth:
    path: .
  FeatureDispatch:
    path: .
  FeatureRecords:
    path: .
  FeatureIncidents:
    path: .
  FeatureCases:
    path: .
  FeaturePatrol:
    path: .
  FeatureFleet:
    path: .
  FeatureServe:
    path: .
  FeatureWarrants:
    path: .
  FeatureShell:
    path: .
  DesignSystem:
    path: .
  CoreOffline:
    path: .
  CorePush:
    path: .
  CoreLocationService:
    path: .
  CoreAudioService:
    path: .
  CoreIDScan:
    path: .
  FeatureQuickActions:
    path: .

targets:
  RMPGFlexConnect:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/RMPGFlexConnect.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.rmpg.flex.connect
        PRODUCT_NAME: "RMPG Flex Connect"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    dependencies:
      - package: CoreAPI
        product: CoreAPI
      - package: CoreAuth
        product: CoreAuth
      - package: FeatureDispatch
        product: FeatureDispatch
      - package: FeatureRecords
        product: FeatureRecords
      - package: FeatureIncidents
        product: FeatureIncidents
      - package: FeatureCases
        product: FeatureCases
      - package: FeaturePatrol
        product: FeaturePatrol
      - package: FeatureFleet
        product: FeatureFleet
      - package: FeatureServe
        product: FeatureServe
      - package: FeatureWarrants
        product: FeatureWarrants
      - package: FeatureShell
        product: FeatureShell
      - package: DesignSystem
        product: DesignSystem
      - package: CoreOffline
        product: CoreOffline
      - package: CorePush
        product: CorePush
      - package: CoreLocationService
        product: CoreLocationService
      - package: CoreAudioService
        product: CoreAudioService
      - package: CoreIDScan
        product: CoreIDScan
      - package: FeatureQuickActions
        product: FeatureQuickActions
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          fi
        basedOnDependencyAnalysis: false
