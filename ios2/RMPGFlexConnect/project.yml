name: RMPGFlexConnect
options:
  bundleIdPrefix: com.rmpg.flex
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

packages:
  RMPGFlexModules:
    path: .

targets:
  RMPGFlexConnect:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/RMPGFlexConnect.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.rmpg.flex.connect
        PRODUCT_NAME: "RMPG Flex Connect"
        DEVELOPMENT_TEAM: Q324WFD9F9
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEMO"
    dependencies:
      - package: RMPGFlexModules
        product: FeatureShell
      - package: RMPGFlexModules
        product: CoreAuth
      - package: RMPGFlexModules
        product: DesignSystem
      - package: RMPGFlexModules
        product: CoreIDScan
      - package: RMPGFlexModules
        product: CoreCarPlay

schemes:
  RMPGFlexConnect:
    build:
      targets:
        RMPGFlexConnect: all
    run:
      config: Debug
    archive:
      config: Release
