<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, sans-serif; background: #0c1a2b; color: #eef2f7; padding: 20px; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; background: #16283d; border: 1px solid #3a4d63; color: #eef2f7; border-radius: 2px; }
    button { padding: 8px 16px; background: #b7c2cf; color: #0c1a2b; border: none; border-radius: 2px; cursor: pointer; font-weight: 600; }
    #error { color: #f87171; font-size: 12px; min-height: 16px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>Enter an admin or manager password to exit Kiosk Mode</h2>
  <input id="username" placeholder="Username" autocomplete="username" />
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
  <div id="error"></div>
  <button id="submit">Exit Kiosk Mode</button>
  <script>
    const submitEl = document.getElementById('submit');
    submitEl.addEventListener('click', async () => {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      submitEl.disabled = true;
      try {
        // ipcRenderer.invoke REJECTS when the main-process handler throws —
        // which is exactly what the IPC sender guard does for an untrusted
        // frame. Without this catch the rejection was swallowed by the async
        // listener and the operator saw the button do nothing at all, on a
        // machine with no other way out. Always surface something.
        const result = await window.kioskEscape.attempt(username, password);
        if (!result || !result.ok) {
          errorEl.textContent = (result && result.error) || 'Unexpected response from the app.';
        }
      } catch (err) {
        errorEl.textContent = `Could not reach the app: ${err && err.message ? err.message : String(err)}`;
      } finally {
        submitEl.disabled = false;
      }
    });
  </script>
</body>
</html>
