<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:;" />
  <title>Rocky Mountain Protective Group</title>
  <style>
    :root {
      --s-base:         #0d1722;
      --s-raised:       #15212e;
      --s-sunken:       #0a1018;
      --s-overlay:      #142840;
      --silver-300:     #e3e9f0;
      --silver-400:     #cfd8e2;
      --text-primary:   #f0f4f9;
      --text-secondary: #a8bccf;
      --text-muted:     #8fa3b8;
      --text-dim:       #6a8ba8;
      --text-hint:      #3e5e7e;
      --sev-critical:   #ef4444;
      --lock-bg:        linear-gradient(135deg, #142840 0%, #0d1722 60%, #0a1018 100%);
      --lock-overlay:   rgba(10, 18, 32, 0.35);
      --glow-color:     rgba(207, 216, 226, 0.18);
      --border-subtle:  rgba(207, 216, 226, 0.08);
      --border-moderate:rgba(207, 216, 226, 0.25);
      --border-visible: rgba(207, 216, 226, 0.35);
      --avatar-bg:      #2d4f6e;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden; background: #000;
      font-family: Arial, sans-serif;
      color: var(--text-primary); -webkit-font-smoothing: antialiased; user-select: none;
    }

    /* ── Phase visibility ── */
    .phase { display: none; width: 100%; height: 100%; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; }
    .phase.active { display: flex; }
    @keyframes fadeOut { to { opacity: 0; } }
    .fading { animation: fadeOut 0.4s ease forwards; }

    /* ── Phase 1: BOOT ── */
    #phase-boot { background: #000; gap: 28px; }
    .boot-logo { width: 160px; height: 160px; object-fit: contain; filter: drop-shadow(0 0 24px var(--glow-color)); }
    .boot-logo-fallback { display: none; }

    /* Windows 11 spinning-dots: 5 dots in a 28px orbit, chase animation */
    .win-dots-ring { position: relative; width: 56px; height: 56px; animation: ringRotate 1.3s linear infinite; }
    .win-dots-ring span { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--silver-400); top: 50%; left: 50%; margin: -2.5px 0 0 -2.5px; }
    .win-dots-ring span:nth-child(1) { transform: translateY(-28px); opacity: 0.15; }
    .win-dots-ring span:nth-child(2) { transform: rotate(72deg) translateY(-28px); opacity: 0.35; }
    .win-dots-ring span:nth-child(3) { transform: rotate(144deg) translateY(-28px); opacity: 0.55; }
    .win-dots-ring span:nth-child(4) { transform: rotate(216deg) translateY(-28px); opacity: 0.78; }
    .win-dots-ring span:nth-child(5) { transform: rotate(288deg) translateY(-28px); opacity: 1.0; }
    @keyframes ringRotate { to { transform: rotate(360deg); } }

    .org-label { font-size: 9px; letter-spacing: 5px; text-transform: uppercase; color: var(--text-muted); opacity: 0; animation: labelFadeIn 0.8s ease 1.5s forwards; }
    @keyframes labelFadeIn { to { opacity: 1; } }

    /* ── Phase 2: LOCK ── */
    #phase-lock { background: var(--lock-bg); gap: 0; position: relative; }
    #phase-lock::before { content: ''; position: absolute; inset: 0; background: var(--lock-overlay); pointer-events: none; z-index: 0; }
    #phase-lock > * { position: relative; z-index: 1; }
    .lock-time { font-size: 72px; font-weight: 200; letter-spacing: -2px; color: var(--text-primary); line-height: 1; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
    .lock-date { font-size: 14px; color: var(--text-secondary); margin-bottom: 44px; letter-spacing: 0.03em; }
    .user-card { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 24px; }
    .avatar-wrap { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; background: var(--avatar-bg); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600; color: var(--silver-400); border: 2px solid var(--border-moderate); flex-shrink: 0; }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-wrap img.hidden { display: none; }
    .user-display-name { font-size: 18px; font-weight: 300; color: var(--text-primary); letter-spacing: 0.02em; }
    .user-sub { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
    .pw-wrap { display: flex; align-items: center; border-bottom: 1px solid var(--border-visible); padding-bottom: 8px; width: 288px; gap: 4px; transition: border-color 0.2s; }
    .pw-wrap:focus-within { border-color: var(--silver-400); }
    .pw-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 14px; letter-spacing: 0.04em; font-family: inherit; }
    .pw-input::placeholder { color: var(--text-hint); }
    .pw-eye, .pw-submit { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; display: flex; align-items: center; transition: color 0.15s; flex-shrink: 0; }
    .pw-eye:hover, .pw-submit:hover { color: var(--text-primary); }
    .pw-submit { font-size: 18px; padding: 4px 6px; }
    .pw-submit:disabled { opacity: 0.4; cursor: default; }
    .lock-error { font-size: 12px; color: var(--sev-critical); margin-top: 10px; height: 16px; text-align: center; width: 288px; }
    .lock-hint { font-size: 10px; color: var(--text-hint); letter-spacing: 1px; margin-top: 28px; }

    /* ── RMPG watermark behind lock/welcome content ── */
    #phase-lock::before, #phase-welcome::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: var(--rmpg-logo-url, none);
      background-repeat: no-repeat;
      background-position: center;
      background-size: 320px auto;
      opacity: 0.045;
      pointer-events: none;
    }

    /* ── Radial glow pulse behind the lock card ── */
    @keyframes lockPulse {
      0%   { transform: translate(-50%, -50%) scale(1);    opacity: 0.06; }
      50%  { transform: translate(-50%, -50%) scale(1.1);  opacity: 0.11; }
      100% { transform: translate(-50%, -50%) scale(1);    opacity: 0.06; }
    }
    #phase-lock::after {
      content: '';
      position: absolute;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-color) 0%, transparent 68%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: lockPulse 4.5s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Phase 3: WELCOME ── */
    #phase-welcome { background: var(--lock-bg); gap: 16px; position: relative; }
    #phase-welcome::before { content: ''; position: absolute; inset: 0; background: var(--lock-overlay); pointer-events: none; z-index: 0; }
    #phase-welcome > * { position: relative; z-index: 1; }
    .welcome-greeting { font-size: 28px; font-weight: 300; color: var(--text-primary); letter-spacing: 0.02em; }
    .welcome-role { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--silver-400); border: 1px solid var(--border-visible); border-radius: 2px; padding: 4px 14px; }
  </style>
</head>
<body>

  <!-- ── Phase 1: BOOT ── -->
  <section id="phase-boot" class="phase active">
    <img id="boot-logo" class="boot-logo" src="./assets/logo.png" alt="Rocky Mountain Protective Group" draggable="false" />
    <div id="boot-logo-fallback" class="boot-logo-fallback" style="display:none;"></div>
    <div class="win-dots-ring">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="org-label">Rocky Mountain Protective Group</div>
  </section>

  <!-- ── Phase 2: LOCK ── -->
  <section id="phase-lock" class="phase">
    <div class="lock-time" id="lock-time">--:--</div>
    <div class="lock-date" id="lock-date"></div>
    <div class="user-card">
      <div class="avatar-wrap" id="avatar-wrap">
        <img id="avatar-img" alt="Profile" class="hidden" />
        <span id="avatar-initials"></span>
      </div>
      <div class="user-display-name" id="user-display-name" data-login-name="">RMPG Flex</div>
      <div class="user-sub">Rocky Mountain Protective Group</div>
    </div>
    <div class="pw-wrap">
      <input class="pw-input" id="pw-input" type="password" placeholder="Password" autocomplete="current-password" />
      <button type="button" class="pw-eye" id="pw-eye" tabindex="-1" aria-label="Show password" title="Show password">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button type="button" class="pw-submit" id="pw-submit" aria-label="Sign in">&#8594;</button>
    </div>
    <div class="lock-error" id="lock-error"></div>
    <!-- Face unlock — shown only when enrollment-status returns true -->
    <div id="face-unlock-section" style="display:none; text-align:center; margin-top:12px;">
      <button id="face-unlock-btn" style="
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.2);
        color: #f0f4f9;
        padding: 8px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      ">Use Face Unlock</button>
      <p id="face-status" style="color:#94a3b8; font-size:12px; margin-top:6px;"></p>
    </div>
    <div class="lock-hint">Press Ctrl+Alt+Shift+F12 for emergency access</div>
  </section>

  <!-- ── Phase 3: WELCOME ── -->
  <section id="phase-welcome" class="phase">
    <div class="welcome-greeting" id="welcome-greeting">Welcome</div>
    <div class="welcome-role" id="welcome-role"></div>
  </section>

  <script>
    'use strict';

    // ── Phase transitions ──
    function showPhase(id) {
      document.querySelectorAll('.phase').forEach(function(el) { el.classList.remove('active'); });
      var el = document.getElementById(id);
      if (el) el.classList.add('active');
    }

    // ── Clock ──
    var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    function updateClock() {
      var now = new Date();
      var h = now.getHours(), m = now.getMinutes();
      document.getElementById('lock-time').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
      document.getElementById('lock-date').textContent = DAYS[now.getDay()] + ', ' + MONTHS[now.getMonth()] + ' ' + now.getDate();
    }
    var clockInterval = null;

    // ── Auth ──
    var submitting = false;
    function doSubmit() {
      if (submitting) return;
      var pw = document.getElementById('pw-input').value;
      if (!pw.trim()) return;
      var username = document.getElementById('user-display-name').dataset.loginName || document.getElementById('user-display-name').textContent;
      submitting = true;
      document.getElementById('lock-error').textContent = '';
      document.getElementById('pw-submit').disabled = true;
      window.splashBridge.sendAuth(username, pw);
    }
    document.getElementById('pw-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') doSubmit(); });
    document.getElementById('pw-submit').addEventListener('click', doSubmit);
    document.getElementById('pw-eye').addEventListener('click', function() {
      var inp = document.getElementById('pw-input');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      inp.focus();
    });

    // ── Phase event handler ──
    window.splashBridge.onPhase(function(evt) {
      var phase = evt.phase;
      var data = evt.data || {};

      if (phase === 'lock') {
        // Populate time/date
        updateClock();
        if (!clockInterval) clockInterval = setInterval(updateClock, 10000);

        // Populate account card
        var displayName = data.fullName || data.name || 'RMPG Flex';
        var loginName = data.name || displayName;
        var nameEl = document.getElementById('user-display-name');
        nameEl.textContent = displayName;
        nameEl.dataset.loginName = loginName;

        var initials = displayName.split(' ').filter(function(w){ return w.length > 0; }).slice(0, 2).map(function(w){ return w[0].toUpperCase(); }).join('');
        document.getElementById('avatar-initials').textContent = initials || 'RG';

        if (data.avatarDataUri) {
          var img = document.getElementById('avatar-img');
          img.src = data.avatarDataUri;
          img.classList.remove('hidden');
          document.getElementById('avatar-initials').style.display = 'none';
        }

        showPhase('phase-lock');
        setTimeout(function() { document.getElementById('pw-input').focus(); }, 200);

        // Attempt to show face unlock button if enrollment exists
        initFaceUnlock(loginName).catch(function(err) {
          console.warn('[FACE-UNLOCK] init error', err);
        });
      }

      if (phase === 'welcome') {
        var h = new Date().getHours();
        var period = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
        var firstName = (data.officerName || '').split(' ')[0] || 'Officer';
        document.getElementById('welcome-greeting').textContent = 'Good ' + period + ', ' + firstName;
        document.getElementById('welcome-role').textContent = (data.role || '').toUpperCase();
        showPhase('phase-welcome');
        // Fade out then signal main to close
        setTimeout(function() {
          document.getElementById('phase-welcome').classList.add('fading');
        }, 2500);
      }
    });

    // ── Auth result handler ──
    window.splashBridge.onAuthResult(function(result) {
      submitting = false;
      document.getElementById('pw-submit').disabled = false;
      if (!result.ok) {
        document.getElementById('lock-error').textContent = result.error || 'Incorrect password';
        document.getElementById('pw-input').value = '';
        document.getElementById('pw-input').focus();
      }
      // On success, main sends splash:phase welcome — no action needed here.
    });

    // ── Face Unlock ───────────────────────────────────────────────
    function loadScript(src) {
      return new Promise(function(resolve, reject) {
        var s = document.createElement('script');
        s.src = src; s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function initFaceUnlock(userId) {
      if (!userId) return;
      var status = await window.splashBridge.faceEnrollmentStatus(userId);
      if (!status || !status.enrolled) return;

      document.getElementById('face-unlock-section').style.display = 'block';

      document.getElementById('face-unlock-btn').addEventListener('click', async function() {
        var statusEl = document.getElementById('face-status');
        statusEl.textContent = 'Looking for your face…';

        try {
          if (typeof faceapi === 'undefined') {
            await loadScript('./vendor/face-api.min.js');
          }
          await faceapi.nets.tinyFaceDetector.loadFromUri('./vendor/face-models');
          await faceapi.nets.faceRecognitionNet.loadFromUri('./vendor/face-models');

          var stream = await navigator.mediaDevices.getUserMedia({ video: true });
          var video = document.createElement('video');
          video.srcObject = stream;
          await new Promise(function(r) { video.onloadedmetadata = r; video.play(); });

          var detection = await faceapi
            .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
            .withFaceLandmarks()
            .withFaceDescriptor();

          stream.getTracks().forEach(function(t) { t.stop(); });

          if (!detection) {
            statusEl.textContent = 'No face detected — use PIN';
            return;
          }

          var embedding = Array.from(detection.descriptor);
          var result = await window.splashBridge.faceVerify(userId, embedding);

          if (result && result.ok) {
            statusEl.textContent = 'Face recognized ✓';
            window.splashBridge.faceUnlockSuccess();
          } else {
            statusEl.textContent = 'Face not recognized — use PIN';
          }
        } catch (err) {
          statusEl.textContent = 'Camera error — use PIN';
          console.error('[FACE-UNLOCK]', err);
        }
      });
    }
  </script>
</body>
</html>
